<style>
  :root {
    --bg:#0e0f13; --bg-2:#16181f; --card:#1c1f28; --card-2:#232733;
    --line:#2a2f3a; --text:#eef1f6; --muted:#8b93a7;
    --accent:#4f8cff; --green:#2ecc71; --red:#ff5c6c; --yellow:#ffce4a;
    --radius:16px; --radius-sm:12px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none; }
  body { display:flex; flex-direction:column; }

  .topbar { position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg,#14161d 0%,#14161dee 100%);
    backdrop-filter:blur(10px);
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;
    border-bottom:1px solid var(--line); }
  .topbar-row { display:flex; align-items:center; justify-content:space-between; }
  .brand { font-size:13px; font-weight:700; letter-spacing:.3px; color:var(--muted); }
  .brand span { color:var(--accent); }
  .balance { display:flex; align-items:center; gap:8px;
    background:var(--card); padding:10px 14px; border-radius:14px;
    border:1px solid var(--line); font-size:18px; font-weight:800; letter-spacing:.3px; }

  main { flex:1; overflow-y:auto; padding:12px 14px 96px; -webkit-overflow-scrolling:touch; }
  .tab { display:none; animation:fade .25s ease; }
  .tab.active { display:block; }
  @keyframes fade { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:none;} }

  .cats { display:flex; gap:8px; overflow-x:auto; padding:6px 0 12px; scrollbar-width:none; }
  .cats::-webkit-scrollbar { display:none; }
  .cat { flex:0 0 auto; padding:9px 14px; border-radius:999px;
    background:var(--card); border:1px solid var(--line);
    font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap; cursor:pointer; }
  .cat.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  .card { background:var(--card); border-radius:var(--radius);
    border:1px solid var(--line); padding:14px; margin-bottom:12px;
    animation:fade .3s ease; }
  .listing { display:flex; gap:12px; }
  .thumb { width:74px; height:74px; flex:0 0 74px; border-radius:var(--radius-sm);
    background:var(--card-2); display:flex; align-items:center; justify-content:center;
    font-size:34px; border:1px solid var(--line); }
  .listing .info { flex:1; min-width:0; }
  .listing .title { font-size:15px; font-weight:700; margin-bottom:3px; }
  .listing .desc { font-size:12px; color:var(--muted); margin-bottom:6px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .prices { display:flex; gap:10px; font-size:13px; margin-bottom:8px; }
  .price-ask { font-weight:800; color:var(--yellow); }
  .price-mkt { color:var(--muted); text-decoration:line-through; }
  .seller { font-size:12px; color:var(--muted); margin-bottom:10px; }

  .btn { display:block; width:100%; border:none; cursor:pointer;
    padding:13px 16px; border-radius:14px; font-size:15px; font-weight:700;
    color:#fff; background:var(--accent); transition:.15s; font-family:inherit; }
  .btn:active { transform:scale(.98); opacity:.9; }
  .btn.ghost { background:var(--card-2); color:var(--text); border:1px solid var(--line); }
  .btn.green { background:var(--green); }
  .btn.red { background:var(--red); }
  .btn.sm { padding:10px 12px; font-size:13px; border-radius:12px; }
  .btn[disabled] { opacity:.5; pointer-events:none; }

  .tabbar { position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:flex; justify-content:space-around;
    background:#14161df2; backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px); }
  .tabbar button { background:none; border:none; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:9px; font-weight:600; padding:4px 6px; cursor:pointer;
    font-family:inherit; }
  .tabbar button .ico { font-size:20px; }
  .tabbar button.active { color:var(--accent); }

  .empty { text-align:center; color:var(--muted); padding:60px 20px; font-size:14px; }
  .empty .big { font-size:42px; margin-bottom:10px; }

  .chat-row { display:flex; align-items:center; gap:12px; padding:12px; cursor:pointer; }
  .chat-avatar { width:46px; height:46px; flex:0 0 46px; border-radius:50%;
    background:var(--card-2); display:flex; align-items:center; justify-content:center;
    font-size:22px; border:1px solid var(--line); }
  .chat-meta { flex:1; min-width:0; }
  .chat-meta .name { font-size:14px; font-weight:700; }
  .chat-meta .last { font-size:12px; color:var(--muted); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { font-size:10px; font-weight:700; padding:3px 8px; border-radius:8px;
    background:var(--card-2); color:var(--muted); }
  .badge.hot { background:rgba(255,92,108,.15); color:var(--red); }
  .badge.new { background:rgba(79,140,255,.15); color:var(--accent); }

  .chatview { position:fixed; inset:0; z-index:100; background:var(--bg);
    display:none; flex-direction:column; }
  .chatview.open { display:flex; }
  .chatview header { display:flex; align-items:center; gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;
    border-bottom:1px solid var(--line); background:var(--bg-2); }
  .chatview header .back { background:none; border:none; color:var(--accent);
    font-size:22px; cursor:pointer; padding:4px 6px; font-family:inherit; }
  .chatview header .who { flex:1; }
  .chatview header .who .n { font-size:15px; font-weight:700; }
  .chatview header .who .s { font-size:11px; color:var(--muted); }
  .msgs { flex:1; overflow-y:auto; padding:14px; display:flex;
    flex-direction:column; gap:8px; }
  .msg { max-width:78%; padding:10px 13px; border-radius:16px;
    font-size:14px; line-height:1.35; word-wrap:break-word; animation:fade .2s ease; }
  .msg.npc { background:var(--card); border-bottom-left-radius:4px; align-self:flex-start; }
  .msg.player { background:var(--accent); color:#fff; border-bottom-right-radius:4px; align-self:flex-end; }
  .msg.system { background:transparent; color:var(--muted); font-size:12px;
    align-self:center; text-align:center; }
  .quick { display:flex; gap:6px; overflow-x:auto; padding:8px 12px;
    border-top:1px solid var(--line); background:var(--bg-2); }
  .quick:empty { display:none; }
  .quick button { flex:0 0 auto; padding:8px 12px; border-radius:999px;
    background:var(--card); border:1px solid var(--line); color:var(--text);
    font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
  .quick button.green { background:rgba(46,204,113,.15); border-color:var(--green); color:var(--green); }
  .inputbar { display:flex; gap:8px; padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);
    background:var(--bg-2); border-top:1px solid var(--line); }
  .inputbar input { flex:1; background:var(--card); border:1px solid var(--line);
    border-radius:999px; padding:11px 16px; color:var(--text);
    font-size:14px; outline:none; font-family:inherit; }
  .inputbar button { background:var(--accent); color:#fff; border:none;
    width:44px; height:44px; border-radius:50%; font-size:18px; cursor:pointer; }

  .modal { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.6);
    backdrop-filter:blur(4px); display:none; align-items:flex-end; }
  .modal.open { display:flex; }
  .modal .sheet { background:var(--bg-2); width:100%; border-radius:24px 24px 0 0;

    animation:slideUp .25s ease; }

  .modal h3 { margin:0 0 6px; font-size:18px; }
  .modal p { margin:0 0 16px; color:var(--muted); font-size:13px; line-height:1.5; }
  .modal input[type=number] { width:100%; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:14px;
    color:var(--text); font-size:18px; font-weight:700; outline:none;
    margin-bottom:14px; font-family:inherit; }

  .deal { display:flex; justify-content:space-between; align-items:center; padding:12px; }
  .deal .l { flex:1; }
  .deal .l .t { font-size:14px; font-weight:600; }
  .deal .l .d { font-size:11px; color:var(--muted); margin-top:2px; }
  .deal .r { text-align:right; }
  .deal .r .p { font-size:15px; font-weight:800; }
  .deal .r .pl { font-size:12px; font-weight:700; }
  .profit { color:var(--green); }
  .loss { color:var(--red); }

  .set-row { display:flex; justify-content:space-between; align-items:center;
    padding:14px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  .set-row:last-child { border-bottom:none; }
  .set-row .k { color:var(--muted); }

  .toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 70px);
    transform:translateX(-50%) translateY(-20px);
    background:var(--card); color:var(--text); padding:12px 18px;
    border-radius:14px; font-size:13px; font-weight:600;
    border:1px solid var(--line); box-shadow:0 8px 30px rgba(0,0,0,.5);
    z-index:300; opacity:0; pointer-events:none; transition:.25s;
    max-width:90vw; text-align:center; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.ok { border-color:var(--green); }
  .toast.err { border-color:var(--red); }

  .loading { position:fixed; inset:0; z-index:500; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:16px; }
  .loading.hide { display:none; }
  .spinner { width:40px; height:40px; border:3px solid var(--line);
    border-top-color:var(--accent); border-radius:50%;
    animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .repair-buttons { display:flex; flex-direction:column; gap:6px; }
  .repair-info { background:var(--card-2); border-radius:12px; padding:12px;
    font-size:12px; color:var(--muted); line-height:1.5; margin-bottom:12px; }
  .repair-tag { display:inline-block; font-size:11px; padding:3px 8px; border-radius:8px;
    background:rgba(46,204,113,.15); color:var(--green); margin-right:4px; margin-top:4px; }
</style>
</head>

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function generateMarket() {
  const list = [];
  Object.entries(TEMPLATES).forEach(([cat, items]) => {
    items.forEach(tpl => {
      const archKey = pick(Object.keys(SELLER_ARCHETYPES));
      const arch = SELLER_ARCHETYPES[archKey];
      list.push({
        id: uid(),
        category: cat,
        title: tpl.t,
        desc: tpl.d,
        image: tpl.i,
        sellerName: pick(NPC_NAMES),
        archetype: archKey,
        askPrice: Math.round(tpl.m * tpl.ask / 100) * 100,
        marketPrice: tpl.m,
        minPrice: Math.round(tpl.m * Math.max(tpl.min, arch.minMul) / 100) * 100,
        isActive: true
      });
    });
  });
  return list.sort(() => Math.random() - .5);
}

function defaultState() {
  return {
    playerId: PLAYER_ID,
    balance: 15000,
    market: generateMarket(),
    inventory: [],
    chats: [],
    messages: [],
    deals: [],
    settings: { testMode: true, buyerDelayMin: 10, buyerDelayMax: 60 }
  };
}

async function loadGame() {
  try {
    const cached = localStorage.getItem('perekup_cache_' + PLAYER_ID);
    if (cached) {
      const parsed = JSON.parse(cached);
      if (parsed && parsed.market) return parsed;
    }
  } catch(e) {}
  try {
    const { data, error } = await sb.from('games').select('state').eq('tg_id', PLAYER_ID).maybeSingle();
    if (error) throw error;
    if (data?.state && data.state.market) return data.state;
  } catch(e) {
    console.warn('Supabase load failed:', e);
  }
  return defaultState();
}

function saveGame() {
  if (!state) return;
  localStorage.setItem('perekup_cache_' + PLAYER_ID, JSON.stringify(state));
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try {
      await sb.from('games').upsert({
        tg_id: PLAYER_ID,
        state: state,
        updated_at: new Date().toISOString()
      });
    } catch(e) {
      console.warn('Supabase save failed:', e);
    }
  }, 800);
}

/* ===== HELPERS ===== */
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const fmt = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';

function toast(text, kind = '') {
  const el = $('#toast');
  el.textContent = text;
  el.className = 'toast show ' + kind;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast ' + kind, 2200);
}

function renderBalance() {
  $('#balance').textContent = fmt(state.balance);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function parseNumber(text) {
  const cleaned = String(text).replace(/\s/g, '');
  const m = cleaned.match(/\d{3,}/);
  return m ? parseInt(m[0], 10) : null;
}

/* ===== NAV ===== */
function switchTab(tab) {
  $$('.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $$('.tab').forEach(t => t.classList.remove('active'));
  $('#tab-' + tab).classList.add('active');
  if (tab === 'market')    renderMarket();
  if (tab === 'inventory') renderInventory();
  if (tab === 'repair')    renderRepair();
  if (tab === 'chats')     renderChats();
  if (tab === 'history')   renderHistory();
  if (tab === 'settings')  renderSettings();
}

/* ===== MARKET ===== */
function renderCategories() {
  $('#cats').innerHTML = CATEGORIES.map(c =>
    `<button class="cat ${c.id === activeCategory ? 'active' : ''}" data-cat="${c.id}">${c.label}</button>`
  ).join('');
  $$('#cats .cat').forEach(b => b.addEventListener('click', () => {
    activeCategory = b.dataset.cat;
    renderMarket();
  }));
}

function renderMarket() {
  renderCategories();
  const items = activeCategory === 'all'
    ? state.market.filter(m => m.isActive)
    : state.market.filter(m => m.isActive && m.category === activeCategory);

  if (!items.length) {
    $('#listings').innerHTML = `<div class="empty"><div class="big">🏪</div>Здесь пока пусто</div>`;
    return;
  }

  $('#listings').innerHTML = items.map(it => {
    const arche = SELLER_ARCHETYPES[it.archetype];
    const hasChat = state.chats.find(c => c.kind === 'seller' && c.refId === it.id);
    return `
      <div class="card listing">
        <div class="thumb">${it.image}</div>
        <div class="info">
          <div class="title">${escapeHtml(it.title)}</div>
          <div class="desc">${escapeHtml(it.desc)}</div>
          <div class="prices">
            <span class="price-ask">${fmt(it.askPrice)}</span>
            <span class="price-mkt">${fmt(it.marketPrice)}</span>
          </div>
          <div class="seller">${it.sellerName} · ${arche.label}</div>
          <button class="btn sm" data-open="${it.id}">
            ${hasChat ? '💬 Открыть чат' : '✍️ Написать продавцу'}
          </button>
        </div>
      </div>`;
  }).join('');

  $$('[data-open]').forEach(b => b.addEventListener('click', () => openSellerChat(b.dataset.open)));
}

/* ===== SELLER CHAT ===== */
function openSellerChat(listingId) {
  const listing = state.market.find(m => m.id === listingId);
  if (!listing) return;

  let chat = state.chats.find(c => c.kind === 'seller' && c.refId === listingId);
  if (!chat) {
    chat = {
      id: uid(),
      kind: 'seller',
      refId: listingId,
      npcName: listing.sellerName,
      archetype: listing.archetype,
      state: {
        stage: 'idle',
        lastOffer: null,
        npcLastPrice: listing.askPrice,
        offersCount: 0,
        agreePrice: null,
        topic: listing.title
      },
      lastMessage: '',
      updatedAt: Date.now()
    };
    state.chats.push(chat);
    saveGame();
  }
  currentChatId = chat.id;
  openChatView();
}

/* ===== CHAT VIEW ===== */
function openChatView() {
  const chat = state.chats.find(c => c.id === currentChatId);
  if (!chat) return;

  $('#chatName').textContent = chat.npcName;

  const archeLabel = chat.kind === 'seller'
    ? SELLER_ARCHETYPES[chat.archetype].label
    : BUYER_ARCHETYPES[chat.archetype].label;

  $('#chatSub').textContent = archeLabel + ' · ' + chat.state.topic;

  renderMessages();
  renderQuickActions();
  $('#chatview').classList.add('open');
}

function closeChatView() {
  $('#chatview').classList.remove('open');
  currentChatId = null;
  renderChats();
  saveGame();
}

/* ===== MESSAGES ===== */
function chatMessages(chatId) {
  return state.messages.filter(m => m.chatId === chatId);
}

function pushMessage(chatId, sender, text, meta = {}) {
  state.messages.push({ id: uid(), chatId, sender, text, meta, createdAt: Date.now() });
  const chat = state.chats.find(c => c.id === chatId);
  if (chat) { chat.lastMessage = text; chat.updatedAt = Date.now(); }
  saveGame();
}

function renderMessages() {
  const msgs = chatMessages(currentChatId);
  const box = $('#chatMsgs');
  if (!msgs.length) {
    box.innerHTML = `<div class="msg system">Начните диалог — напишите «Привет»</div>`;
    return;
  }
  box.innerHTML = msgs.map(m => {
    const cls = m.sender === 'player' ? 'player' : m.sender === 'system' ? 'system' : 'npc';
    return `<div class="msg ${cls}">${escapeHtml(m.text)}</div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

/* ===== QUICK ACTIONS ===== */
function renderQuickActions() {
  const chat = state.chats.find(c => c.id === currentChatId);
  if (!chat) return;
  const box = $('#chatQuick');
  const btns = [];

  if (chat.kind === 'seller') {
    const st = chat.state;
    if (st.stage === 'idle' || st.stage === 'negotiating') {
      btns.push(`<button data-q="Привет">Привет</button>`);
      btns.push(`<button data-q="Товар ещё продаётся?">Ещё продаётся?</button>`);
      const listing = state.market.find(m => m.id === chat.refId);
      if (listing) {
        const start = Math.round((listing.askPrice * 0.8) / 100) * 100;
        btns.push(`<button data-q="${start}">Предложить ${fmt(start)}</button>`);
      }
    }
    if (st.stage === 'agreed' && st.agreePrice) {
      if (state.balance >= st.agreePrice) {
        btns.push(`<button class="green" data-buy="1">🤝 Купить за ${fmt(st.agreePrice)}</button>`);
      } else {
        btns.push(`<button disabled>Недостаточно средств</button>`);
      }
    }
  } else {
    const st = chat.state;
    if (st.stage === 'buyer_waiting') {
      btns.push(`<button data-q="Да, продаётся">Да</button>`);
      btns.push(`<button data-q="Нет, уже продано">Уже нет</button>`);
    }
    if (st.stage === 'buyer_negotiating') {
      btns.push(`<button data-q="Мало">Мало</button>`);
      if (st.buyerLastOffer) {
        btns.push(`<button data-q="Согласен">Согласен</button>`);
      }
    }
    if (st.stage === 'buyer_agreed' && st.agreePrice) {
      btns.push(`<button class="green" data-sell="1">🤝 Продать за ${fmt(st.agreePrice)}</button>`);
    }
  }

  box.innerHTML = btns.join('');
  $$('#chatQuick button').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.buy)  return finalizeBuy();
      if (b.dataset.sell) return finalizeSell();
      sendPlayerMessage(b.dataset.q);
    });
  });
}

/* ===== SEND ===== */
function sendPlayerMessage(text) {
  const chat = state.chats.find(c => c.id === currentChatId);
  if (!chat) return;
  if (chat.state.stage === 'done' || chat.state.stage === 'refused' ||
      chat.state.stage === 'buyer_done' || chat.state.stage === 'buyer_completed') {
    toast('Сделка уже завершена');
    return;
  }

  const num = parseNumber(text);
  pushMessage(chat.id, 'player', text, num ? { offer: num } : {});
  renderMessages();

  setTimeout(() => {
    const reply = chat.kind === 'seller'
      ? sellerReply(chat, text, num)
      : buyerReply(chat, text, num);
    if (reply) {
      pushMessage(chat.id, 'npc', reply.text, reply.meta || {});
      renderMessages();
      renderQuickActions();
    }
  }, 500 + Math.random() * 700);
}

/* ===== SELLER REPLY ===== */
function sellerReply(chat, text, offerNum) {
  const listing = state.market.find(m => m.id === chat.refId);
  if (!listing) return { text: 'Товар уже снят с продажи.' };

  const st = chat.state;
  const arche = SELLER_ARCHETYPES[chat.archetype];
  const t = text.toLowerCase();

  // Согласие игрока — обрабатывается РАНЬШЕ всего остального
  const isAgree = /договорились|согласен|согласна|беру|берём|ок|окей|хорошо|давай|по рукам|годится|идет|идёт/i.test(t);
  if (isAgree && (st.stage === 'negotiating' || st.stage === 'idle')) {
    if (st.agreePrice) {
      st.stage = 'agreed';
      return { text: `Отлично, по рукам! ${fmt(st.agreePrice)}. Жми кнопку «Купить».`, meta: { agree: st.agreePrice } };
    }
    st.agreePrice = st.npcLastPrice;
    st.stage = 'agreed';
    return { text: `Хорошо, ${fmt(st.agreePrice)}. Жми кнопку «Купить».`, meta: { agree: st.agreePrice } };
  }

  if (/привет|здравств|добрый|хай|hi|hello/.test(t) && !offerNum && st.stage === 'idle') {
    st.stage = 'negotiating';
    return { text: `${pick(arche.phrases)} Товар — «${listing.title}», цена ${fmt(listing.askPrice)}.` };
  }

  if (/прода|актуальн|есть|в наличии/.test(t) && !offerNum) {
    if (st.stage === 'idle') st.stage = 'negotiating';
    return { text: `Да, товар ещё есть. Цена ${fmt(st.npcLastPrice)}.` };
  }

  if (offerNum) {
    st.offersCount++;
    st.lastOffer = offerNum;

    if (offerNum < listing.minPrice) {
      if (st.offersCount >= arche.maxOffers && (chat.archetype === 'stubborn' || chat.archetype === 'greedy')) {
        st.stage = 'refused';
        return { text: 'Слушай, это слишком мало. Не договоримся.', meta: { refused: true } };
      }
      const counter = Math.round((listing.minPrice + st.npcLastPrice) / 2 / 100) * 100;
      st.npcLastPrice = Math.min(st.npcLastPrice, counter);
      return { text: `${fmt(offerNum)} — маловато будет. Могу уступить до ${fmt(counter)}.`, meta: { counter } };
    }

    if (offerNum < st.npcLastPrice) {
      const step = arche.stepMul[Math.min(st.offersCount - 1, arche.stepMul.length - 1)];
      const newPrice = Math.max(listing.minPrice,
        Math.round((st.npcLastPrice - listing.askPrice * step) / 100) * 100);
      if (Math.abs(newPrice - offerNum) <= listing.askPrice * 0.02) {
        st.agreePrice = offerNum;
        st.stage = 'negotiating';
        return { text: `Ладно, давай ${fmt(offerNum)} и по рукам. Напиши «договорились».`, meta: { agree: offerNum } };
      }
      st.npcLastPrice = newPrice;
      return { text: `${fmt(offerNum)} мало. Могу уступить до ${fmt(newPrice)}.`, meta: { counter: newPrice } };
    }

    if (offerNum >= st.npcLastPrice) {
      st.agreePrice = st.npcLastPrice;
      st.stage = 'negotiating';
      return { text: `Да без проблем, ${fmt(st.npcLastPrice)}. Пиши «договорились».`, meta: { agree: st.npcLastPrice } };
    }
  }

  if (st.stage === 'refused') return { text: 'Мы уже закончили обсуждение.' };

  if (st.stage === 'idle') {
    st.stage = 'negotiating';
    return { text: pick(arche.phrases) + ` Товар: «${listing.title}». Цена — ${fmt(st.npcLastPrice)}.` };
  }

  return { text: pick([
    `Ну так что, берёшь за ${fmt(st.npcLastPrice)}?`,
    `Моя цена — ${fmt(st.npcLastPrice)}.`,
    `Слушаю, какие предложения?`,
    `Готов обсудить.`
  ]) };
}

/* ===== BUYER REPLY ===== */
function buyerReply(chat, text, offerNum) {
  const inv = state.inventory.find(i => i.id === chat.refId);
  if (!inv) return { text: 'Что-то не найду объявление...' };

  const st = chat.state;
  const arche = BUYER_ARCHETYPES[chat.archetype];
  const t = text.toLowerCase();
  const listedPrice = inv.listedPrice;

  const isAgree = /договорились|согласен|согласна|продаю|продам|беру|берём|ок|окей|хорошо|давай|по рукам|годится/i.test(t);
  if (isAgree && st.stage === 'buyer_negotiating' && st.buyerLastOffer) {
    st.agreePrice = st.buyerLastOffer;
    st.stage = 'buyer_agreed';
    return { text: `Отлично, забираю за ${fmt(st.agreePrice)}!`, meta: { agree: st.agreePrice } };
  }

  if (/да|есть|продаётся|актуальн/.test(t) && st.stage === 'buyer_waiting') {
    st.stage = 'buyer_negotiating';
    const first = Math.round(listedPrice * (0.85 + Math.random() * 0.1) / 100) * 100;
    st.buyerLastOffer = first;
    st.maxBudget = Math.round(listedPrice * arche.maxMul / 100) * 100;
    return { text: `Отлично! Готов забрать за ${fmt(first)}.`, meta: { offer: first } };
  }

  if (/нет|уже нет|продано/.test(t) && st.stage === 'buyer_waiting') {
    st.stage = 'buyer_done';
    return { text: 'Понял, извините за беспокойство.' };
  }

  if (/мало|дорого|дешевле/.test(t) && st.stage === 'buyer_negotiating') {
    st.offersCount++;
    const step = arche.stepMul[Math.min(st.offersCount - 1, arche.stepMul.length - 1)];
    let next = Math.round((st.buyerLastOffer + listedPrice * step) / 100) * 100;
    if (next > st.maxBudget) {
      if (st.offersCount >= arche.maxOffers) {
        st.stage = 'buyer_done';
        return { text: 'Дорого для меня. Подумаю.' };
      }
      next = st.maxBudget;
    }
    if (next >= listedPrice) {
      st.agreePrice = listedPrice;
      st.stage = 'buyer_agreed';
      return { text: `Хорошо, беру по вашей цене — ${fmt(listedPrice)}!`, meta: { agree: listedPrice } };
    }
    st.buyerLastOffer = next;
    return { text: `Тогда ${fmt(next)}. Это моя лучшая цена.`, meta: { offer: next } };
  }

  if (offerNum && st.stage === 'buyer_negotiating') {
    if (offerNum <= st.buyerLastOffer) {
      st.agreePrice = offerNum;
      st.stage = 'buyer_agreed';
      return { text: `Беру за ${fmt(offerNum)}!`, meta: { agree: offerNum } };
    }
    if (offerNum > st.maxBudget) {
      st.offersCount++;
      if (st.offersCount >= arche.maxOffers) {
        st.stage = 'buyer_done';
        return { text: 'Дороговато для меня.' };
      }
      return { text: `Дорого, могу максимум ${fmt(st.maxBudget)}.`, meta: { offer: st.maxBudget } };
    }
    st.buyerLastOffer = offerNum;
    return { text: `Хорошо, ${fmt(offerNum)} — жми кнопку продажи.`, meta: { agree: offerNum } };
  }

  return { text: pick(['Так что по цене?', 'Готов забрать, если сойдёмся.', 'Слушаю вас.']) };
}

/* ===== FINALIZE BUY ===== */
function finalizeBuy() {
  const chat = state.chats.find(c => c.id === currentChatId);
  if (!chat || chat.kind !== 'seller') return;
  const listing = state.market.find(m => m.id === chat.refId);
  const price = chat.state.agreePrice;
  if (!listing || !price) return;
  if (state.balance < price) return toast('Недостаточно средств', 'err');

  state.balance -= price;
  listing.isActive = false;
  state.inventory.push({
    id: uid(),
    title: listing.title,
    category: listing.category,
    image: listing.image,
    buyPrice: price,
    marketPrice: listing.marketPrice,
    status: 'owned',
    listedPrice: null,
    repairSpent: 0,
    repairBoost: 0,
    repairs: [],
    createdAt: Date.now()
  });
  state.deals.push({
    id: uid(), kind: 'buy', title: listing.title,
    price, profit: 0, createdAt: Date.now()
  });
  chat.state.stage = 'done';
  pushMessage(chat.id, 'system', `Сделка закрыта. Куплено за ${fmt(price)}.`);
  pushMessage(chat.id, 'npc', 'Отлично, договорились!');

  saveGame();
  renderBalance();
  renderMessages();
  renderQuickActions();
  toast('Куплено: ' + listing.title, 'ok');
}

/* ===== FINALIZE SELL ===== */
function finalizeSell() {
  const chat = state.chats.find(c => c.id === currentChatId);
  if (!chat || chat.kind !== 'buyer') return;
  const inv = state.inventory.find(i => i.id === chat.refId);
  const price = chat.state.agreePrice;
  if (!inv || !price) return;

  const profit = price - inv.buyPrice - (inv.repairSpent || 0);
  state.balance += price;
  inv.status = 'sold';

  state.deals.push({
    id: uid(), kind: 'sell', title: inv.title,
    price, profit, createdAt: Date.now()
  });
  chat.state.stage = 'buyer_completed';
  pushMessage(chat.id, 'system', `Продано за ${fmt(price)}. Прибыль: ${profit >= 0 ? '+' : ''}${fmt(profit)}.`);
  pushMessage(chat.id, 'npc', 'Спасибо! Всё отлично, товар забрал.');

  saveGame();
  renderBalance();
  renderMessages();
  renderQuickActions();
  toast(`Продано! ${profit >= 0 ? 'Прибыль' : 'Убыток'}: ${fmt(Math.abs(profit))}`, profit >= 0 ? 'ok' : 'err');
}

/* ===== INVENTORY ===== */
function renderInventory() {
  const owned = state.inventory.filter(i => i.status !== 'sold');
  if (!owned.length) {
    $('#inventory').innerHTML = `<div class="empty"><div class="big">📦</div>У вас пока нет товаров.<br>Купите что-нибудь на рынке.</div>`;
    return;
  }
  $('#inventory').innerHTML = owned.map(it => {
    const statusText =
      it.status === 'owned'  ? 'Не выставлен' :
      it.status === 'listed' ? (it.hasTalks ? '💬 Есть переговоры' : '🔎 Ищем покупателя') :
      it.status;
    const canList = it.status === 'owned';
    return `
      <div class="card listing">
        <div class="thumb">${it.image}</div>
        <div class="info">
          <div class="title">${escapeHtml(it.title)}</div>
          <div class="desc">Куплено за ${fmt(it.buyPrice)}${it.repairSpent ? ' · ремонт ' + fmt(it.repairSpent) : ''}</div>
          <div class="prices">
            <span class="price-ask">${it.listedPrice ? fmt(it.listedPrice) : '—'}</span>
            <span class="price-mkt">${fmt(it.marketPrice)}</span>
          </div>
          <div class="seller">Статус: ${statusText}</div>
          <button class="btn sm ${canList ? '' : 'ghost'}" data-list="${it.id}" ${canList ? '' : 'disabled'}>
            ${canList ? '💰 Продать' : '✅ Уже выставлен'}
          </button>
        </div>
      </div>`;
  }).join('');
  $$('[data-list]').forEach(b => b.addEventListener('click', () => openListModal(b.dataset.list)));
}

/* ===== LIST MODAL ===== */
function openListModal(invId) {
  const inv = state.inventory.find(i => i.id === invId);
  if (!inv) return;
  const recommended = Math.round(inv.marketPrice * 1.05 / 100) * 100;
  const maxReasonable = Math.round(inv.marketPrice * 2.5 / 100) * 100;

  $('#modalSheet').innerHTML = `
    <h3>Выставить «${escapeHtml(inv.title)}»</h3>
    <p>Рыночная цена: <b>${fmt(inv.marketPrice)}</b>. Рекомендуем ~${fmt(recommended)}.
    <br><span style="color:var(--yellow);">Выше ${fmt(maxReasonable)} покупателей почти не будет.</span></p>
    <input id="listPrice" type="number" value="${recommended}" />
    <button class="btn" id="doList">✅ Выставить</button>
    <button class="btn ghost" id="cancelList" style="margin-top:8px;">Отмена</button>
  `;
  $('#modal').classList.add('open');

  $('#cancelList').addEventListener('click', closeModal);
  $('#doList').addEventListener('click', () => {
    const v = parseInt($('#listPrice').value, 10);
    if (!v || v < 100) return toast('Укажите цену', 'err');
    if (v > inv.marketPrice * 2.5) {
      const ok = confirm(`Цена ${fmt(v)} сильно выше рынка (${fmt(inv.marketPrice)}).\nПокупатели почти не будут писать. Всё равно выставить?`);
      if (!ok) return;
    }
    inv.status = 'listed';
    inv.listedPrice = v;
    inv.listedAt = Date.now();
    inv.hasTalks = false;
    scheduleBuyerForInventory(inv.id);
    saveGame();
    closeModal();
    renderInventory();
    toast('Товар выставлен!', 'ok');
  });
}

function closeModal() { $('#modal').classList.remove('open'); }

/* ===== BUYER SCHEDULER ===== */
function scheduleBuyerForInventory(invId) {
  const inv = state.inventory.find(i => i.id === invId);
  if (!inv || inv.status !== 'listed') return;

  // Не ищем покупателей, если цена абсурдно высокая
  if (inv.listedPrice > inv.marketPrice * 2.5) return;

  const minSec = state.settings.testMode ? 5 : state.settings.buyerDelayMin * 60;
  const maxSec = state.settings.testMode ? 25 : state.settings.buyerDelayMax * 60;
  const delayMs = (minSec + Math.random() * (maxSec - minSec)) * 1000;

  setTimeout(() => {
    const fresh = state.inventory.find(i => i.id === invId);
    if (!fresh || fresh.status !== 'listed') return;

    const overprice = fresh.listedPrice / fresh.marketPrice;

    // Реалистичная оценка: чем выше цена — тем меньше шансов
    let chance;
    if (overprice <= 0.8)       chance = 1.00;
    else if (overprice <= 1.0)  chance = 0.90;
    else if (overprice <= 1.15) chance = 0.65;
    else if (overprice <= 1.30) chance = 0.35;
    else if (overprice <= 1.50) chance = 0.12;
    else if (overprice <= 2.00) chance = 0.04;
    else                        chance = 0.00;

    if (overprice > 2.5) return;

    if (Math.random() > chance) {
      scheduleBuyerForInventory(invId);
      return;
    }
    createBuyerChat(fresh);
  }, delayMs);
}

function createBuyerChat(inv) {
  // Защита: не создаём покупателя, если цена выше рынка больше чем в 2.5 раза
  if (inv.listedPrice > inv.marketPrice * 2.5) return;

  const archetypeKey = pick(Object.keys(BUYER_ARCHETYPES));
  const arche = BUYER_ARCHETYPES[archetypeKey];
  const name = pick(NPC_NAMES);

  const chat = {
    id: uid(),
    kind: 'buyer',
    refId: inv.id,
    npcName: name,
    archetype: archetypeKey,
    state: {
      stage: 'buyer_waiting',
      topic: inv.title,
      listedPrice: inv.listedPrice,
      buyerLastOffer: null,
      maxBudget: Math.round(inv.listedPrice * arche.maxMul / 100) * 100,
      offersCount: 0,
      agreePrice: null
    },
    lastMessage: '',
    updatedAt: Date.now()
  };
  state.chats.push(chat);
  inv.hasTalks = true;
  pushMessage(chat.id, 'npc', pick(arche.greeting));
  saveGame();
  toast(`💬 Новое сообщение от ${name}`, 'ok');
  if ($('#tab-chats').classList.contains('active')) renderChats();
}

/* ===== CHATS LIST ===== */
function renderChats() {
  const chats = [...state.chats].sort((a, b) => b.updatedAt - a.updatedAt);
  if (!chats.length) {
    $('#chats').innerHTML = `<div class="empty"><div class="big">💬</div>Пока нет чатов.<br>Напишите продавцу на рынке или выставьте товар.</div>`;
    return;
  }
  $('#chats').innerHTML = chats.map(c => {
    const archeLabel = c.kind === 'seller'
      ? SELLER_ARCHETYPES[c.archetype].label
      : BUYER_ARCHETYPES[c.archetype].label;
    const stage = c.state.stage;
    let badge = '';
    if (c.kind === 'buyer' && stage === 'buyer_agreed')       badge = '<span class="badge hot">Продать</span>';
    else if (c.kind === 'seller' && stage === 'agreed')       badge = '<span class="badge hot">Купить</span>';
    else if (stage.startsWith('buyer_'))                      badge = '<span class="badge new">Покупатель</span>';

    return `
      <div class="card chat-row" data-chat="${c.id}">
        <div class="chat-avatar">${c.kind === 'seller' ? '🏪' : '👤'}</div>
        <div class="chat-meta">
          <div class="name">${c.npcName} · ${archeLabel}</div>
          <div class="last">${escapeHtml(c.lastMessage || 'Начните диалог')}</div>
        </div>
        ${badge}
      </div>`;
  }).join('');

  $$('[data-chat]').forEach(el => el.addEventListener('click', () => {
    currentChatId = el.dataset.chat;
    openChatView();
  }));
}

/* ===== HISTORY ===== */
function renderHistory() {
  const deals = [...state.deals].sort((a, b) => b.createdAt - a.createdAt);
  if (!deals.length) {
    $('#history').innerHTML = `<div class="empty"><div class="big">📊</div>История пуста.<br>Сделки появятся здесь.</div>`;
    return;
  }
  const total = deals.filter(d => d.kind === 'sell').reduce((s, d) => s + (d.profit || 0), 0);

  const head = `
    <div class="card" style="text-align:center;">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">Общая прибыль</div>
      <div class="${total >= 0 ? 'profit' : 'loss'}" style="font-size:26px;font-weight:800;">
        ${total >= 0 ? '+' : ''}${fmt(total)}
      </div>
    </div>`;

  const list = deals.map(d => {
    const isBuy = d.kind === 'buy';
    const date = new Date(d.createdAt).toLocaleString('ru-RU',
      { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    let right = '';
    if (isBuy) {
      right = `<div class="p">-${fmt(d.price)}</div><div class="d">Покупка</div>`;
    } else {
      const p = d.profit || 0;
      right = `<div class="p">+${fmt(d.price)}</div>
               <div class="pl ${p >= 0 ? 'profit' : 'loss'}">${p >= 0 ? '+' : ''}${fmt(p)}</div>`;
    }
    return `
      <div class="card deal">
        <div class="l">
          <div class="t">${isBuy ? '🛒' : '💰'} ${escapeHtml(d.title)}</div>
          <div class="d">${date}</div>
        </div>
        <div class="r">${right}</div>
      </div>`;
  }).join('');

  $('#history').innerHTML = head + list;
}

/* ===== REPAIR ===== */
function repairCost(item, basePrice) {
  const spent = item.repairSpent || 0;
  let markup;
  if (spent < 5000)       markup = 500;
  else if (spent < 30000) markup = 1000;
  else                    markup = 3000;

  const steps = Math.floor(spent / markup);
  return basePrice + steps * markup;
}

function renderRepair() {
  const owned = state.inventory.filter(i => i.status !== 'sold');

  if (!owned.length) {
    $('#repair').innerHTML = `<div class="empty"><div class="big">🔧</div>Нечего ремонтировать.<br>Купите товар на рынке.</div>`;
    return;
  }

  $('#repair').innerHTML = `
    <div class="repair-info">
      💡 Ремонт повышает рыночную цену товара на <b>40% от затрат</b>.
      Чем больше вложено — тем дороже следующий ремонт:
      до 5 000 ₽ → шаг 500 ₽ · 5–30к → 1 000 ₽ · после 30к → 3 000 ₽.
    </div>
  ` + owned.map(it => {
    const spent = it.repairSpent || 0;
    const boost = it.repairBoost || 0;
    const itemRepairs = it.repairs || [];

    const repairButtons = Object.entries(REPAIR_TYPES).map(([key, def]) => {
      const cost = repairCost(it, def.base);
      const canAfford = state.balance >= cost;
      return `<button class="btn sm ${canAfford ? '' : 'ghost'}"
        data-repair="${key}" data-item="${it.id}" ${canAfford ? '' : 'disabled'}>
        ${def.label} — ${fmt(cost)}
      </button>`;
    }).join('');

    const historyHtml = itemRepairs.length
      ? `<div style="margin-top:8px;">${itemRepairs.map(r =>
          `<span class="repair-tag">${REPAIR_TYPES[r].label}</span>`).join('')}</div>`
      : '';

    return `
      <div class="card">
        <div class="listing" style="margin-bottom:12px;">
          <div class="thumb">${it.image}</div>
          <div class="info">
            <div class="title">${escapeHtml(it.title)}</div>
            <div class="desc">Куплено за ${fmt(it.buyPrice)}</div>
            <div class="prices">
              <span class="price-ask">${fmt(it.marketPrice)}</span>
              ${boost > 0 ? `<span style="color:var(--green);font-size:12px;">+${fmt(boost)}</span>` : ''}
            </div>
            <div class="seller">
              💸 Вложено: ${fmt(spent)}${boost > 0 ? ` · 📈 Прибавка: +${fmt(boost)}` : ''}
            </div>
            ${historyHtml}
          </div>
        </div>
        <div class="repair-buttons">${repairButtons}</div>
      </div>`;
  }).join('');

  $$('[data-repair]').forEach(b => b.addEventListener('click', () => {
    doRepair(b.dataset.item, b.dataset.repair);
  }));
}

function doRepair(itemId, repairKey) {
  const inv = state.inventory.find(i => i.id === itemId);
  if (!inv) return;
  const def = REPAIR_TYPES[repairKey];
  if (!def) return;

  const cost = repairCost(inv, def.base);
  if (state.balance < cost) return toast('Недостаточно средств', 'err');

  state.balance -= cost;
  const boost = Math.round(cost * 1.4);
  inv.repairBoost = (inv.repairBoost || 0) + boost;
  inv.marketPrice += boost;
  inv.repairSpent = (inv.repairSpent || 0) + cost;
  inv.repairs = inv.repairs || [];
  inv.repairs.push(repairKey);

  saveGame();
  renderBalance();
  renderRepair();
  toast(`${def.label} готово! +${fmt(boost)} к цене`, 'ok');
}

/* ===== SETTINGS ===== */
function renderSettings() {
  const s = state.settings;
  $('#settings').innerHTML = `
    <div class="set-row"><span class="k">Игрок</span><span>${PLAYER_ID}</span></div>
    <div class="set-row"><span class="k">Баланс</span><span><b>${fmt(state.balance)}</b></span></div>
    <div class="set-row"><span class="k">Сделок всего</span><span>${state.deals.length}</span></div>
    <div class="set-row"><span class="k">Товаров в инвентаре</span><span>${state.inventory.filter(i => i.status !== 'sold').length}</span></div>
    <div class="set-row"><span class="k">Тестовый режим (быстрые покупатели)</span>
      <button class="btn sm ghost" id="toggleTest" style="width:auto;">${s.testMode ? 'ВКЛ' : 'ВЫКЛ'}</button>
    </div>
    <div class="set-row"><span class="k">Сбросить прогресс</span>
      <button class="btn sm red" id="reset" style="width:auto;">Сбросить</button>
    </div>
  `;
  $('#toggleTest').addEventListener('click', () => {
    s.testMode = !s.testMode;
    saveGame();
    renderSettings();
    toast('Тестовый режим: ' + (s.testMode ? 'ВКЛ' : 'ВЫКЛ'));
  });
  $('#reset').addEventListener('click', async () => {
    if (!confirm('Удалить весь прогресс?')) return;
    try { await sb.from('games').delete().eq('tg_id', PLAYER_ID); } catch(e) {}
    localStorage.removeItem('perekup_cache_' + PLAYER_ID);
    location.reload();
  });
}

/* ===== BIND ===== */
function bindEvents() {
  $$('.tabbar button').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  $('#chatBack').addEventListener('click', closeChatView);

  $('#chatSend').addEventListener('click', () => {
    const v = $('#chatInput').value.trim();
    if (!v) return;
    $('#chatInput').value = '';
    sendPlayerMessage(v);
  });

  $('#chatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); $('#chatSend').click(); }
  });

  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
}

/* ===== LOOP ===== */
function startBuyerLoop() {
  setInterval(() => {
    state.inventory.filter(i => i.status === 'listed').forEach(inv => {
      if (inv.listedPrice > inv.marketPrice * 2.5) return;
      const hasChat = state.chats.some(c => c.kind === 'buyer' && c.refId === inv.id
        && !['buyer_done', 'buyer_completed'].includes(c.state.stage));
      if (!hasChat && Math.random() < 0.15) createBuyerChat(inv);
    });
  }, 30000);
}

/* ===== TELEGRAM ===== */
function initTelegram() {
  const tg = window.Telegram?.WebApp;
  if (!tg) return;
  try {
    tg.ready();
    tg.expand();
    tg.setHeaderColor?.('#0e0f13');
    tg.setBackgroundColor?.('#0e0f13');
    tg.disableVerticalSwipes?.();
  } catch(e) {}
}

/* ===== BOOT ===== */
(async function boot() {
  initTelegram();
  bindEvents();

  state = await loadGame();
  saveGame();

  $('#loading').classList.add('hide');
  renderBalance();
  renderMarket();
  renderSettings();

  startBuyerLoop();
})();
</script>

:root{--bg:#0e0f13;--bg-2:#16181f;--card:#1c1f28;--card-2:#232733;--line:#2a2f3a;--text:#eef1f6;--muted:#8b93a7;--accent:#4f8cff;--green:#2ecc71;--red:#ff5c6c;--yellow:#ffce4a;--radius:16px;--radius-sm:12px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none;}
body{display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#14161d 0%,#14161dee 100%);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;border-bottom:1px solid var(--line);}
.topbar-row{display:flex;align-items:center;justify-content:space-between;}
.brand{font-size:13px;font-weight:700;letter-spacing:.3px;color:var(--muted);}
.brand span{color:var(--accent);}
.balance{display:flex;align-items:center;gap:8px;background:var(--card);padding:10px 14px;border-radius:14px;border:1px solid var(--line);font-size:18px;font-weight:800;letter-spacing:.3px;}
main{flex:1;overflow-y:auto;padding:12px 14px 96px;-webkit-overflow-scrolling:touch;}
.tab{display:none;animation:fade .25s ease;}
.tab.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.cats{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;scrollbar-width:none;}
.cats::-webkit-scrollbar{display:none;}
.cat{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer;}
.cat.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:14px;margin-bottom:12px;animation:fade .3s ease;}
.listing{display:flex;gap:12px;}
.thumb{width:74px;height:74px;flex:0 0 74px;border-radius:var(--radius-sm);background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:34px;border:1px solid var(--line);}
.listing .info{flex:1;min-width:0;}
.listing .title{font-size:15px;font-weight:700;margin-bottom:3px;}
.listing .desc{font-size:12px;color:var(--muted);margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.prices{display:flex;gap:10px;font-size:13px;margin-bottom:8px;}
.price-ask{font-weight:800;color:var(--yellow);}
.price-mkt{color:var(--muted);text-decoration:line-through;}
.seller{font-size:12px;color:var(--muted);margin-bottom:10px;}
.btn{display:block;width:100%;border:none;cursor:pointer;padding:13px 16px;border-radius:14px;font-size:15px;font-weight:700;color:#fff;background:var(--accent);transition:.15s;font-family:inherit;}
.btn:active{transform:scale(.98);opacity:.9;}
.btn.ghost{background:var(--card-2);color:var(--text);border:1px solid var(--line);}
.btn.green{background:var(--green);}
.btn.red{background:var(--red);}
.btn.sm{padding:10px 12px;font-size:13px;border-radius:12px;}
.btn[disabled]{opacity:.5;pointer-events:none;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{flex:1;}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:#14161df2;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 4px calc(env(safe-area-inset-bottom,0px) + 8px);}
.tabbar button{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8px;font-weight:600;padding:4px 2px;cursor:pointer;font-family:inherit;position:relative;flex:1;}
.tabbar button .ico{font-size:17px;}
.tabbar button.active{color:var(--accent);}
.tabbar .dot{position:absolute;top:2px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--red);}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;}
.empty .big{font-size:42px;margin-bottom:10px;}
.chat-row{display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer;}
.chat-avatar{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid var(--line);position:relative;}
.chat-avatar.online::after{content:'';position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid var(--card);}
.chat-meta{flex:1;min-width:0;}
.chat-meta .name{font-size:14px;font-weight:700;}
.chat-meta .last{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--card-2);color:var(--muted);}
.badge.hot{background:rgba(255,92,108,.15);color:var(--red);}
.badge.new{background:rgba(79,140,255,.15);color:var(--accent);}
.badge.online{background:rgba(46,204,113,.15);color:var(--green);}
.chatview{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;}
.chatview.open{display:flex;}
.chatview header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;border-bottom:1px solid var(--line);background:var(--bg-2);}
.chatview header .back{background:none;border:none;color:var(--accent);font-size:22px;cursor:pointer;padding:4px 6px;font-family:inherit;}
.chatview header .who{flex:1;min-width:0;}
.chatview header .who .n{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chatview header .who .s{font-size:11px;color:var(--muted);}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;}
.msg{max-width:78%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.35;word-wrap:break-word;animation:fade .2s ease;}
.msg.npc{background:var(--card);border-bottom-left-radius:4px;align-self:flex-start;}
.msg.player{background:var(--accent);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
.msg.other{background:var(--card-2);border-bottom-left-radius:4px;align-self:flex-start;}
.msg.system{background:transparent;color:var(--muted);font-size:12px;align-self:center;text-align:center;}
.msg-name{font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:600;}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--line);background:var(--bg-2);}
.quick:empty{display:none;}
.quick button{flex:0 0 auto;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.quick button.green{background:rgba(46,204,113,.15);border-color:var(--green);color:var(--green);}
.quick button.red{background:rgba(255,92,108,.15);border-color:var(--red);color:var(--red);}
.inputbar{display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--bg-2);border-top:1px solid var(--line);}
.inputbar input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:11px 16px;color:var(--text);font-size:14px;outline:none;font-family:inherit;}
.inputbar button{background:var(--accent);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;}
.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:flex-end;}
.modal.open{display:flex;}
.modal .sheet{background:var(--bg-2);width:100%;border-radius:24px 24px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 22px);animation:slideUp .25s ease;}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6;}to{transform:none;opacity:1;}}
.modal h3{margin:0 0 6px;font-size:18px;}
.modal p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.5;}
.modal input,.modal textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--text);font-size:16px;font-weight:600;outline:none;margin-bottom:14px;font-family:inherit;}
.cost-info{background:var(--card-2);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:12px;}
.cost-info b{color:var(--text);}
.cost-info .hi{color:var(--green);}
.deal{display:flex;justify-content:space-between;align-items:center;padding:12px;}
.deal .l{flex:1;}
.deal .l .t{font-size:14px;font-weight:600;}
.deal .l .d{font-size:11px;color:var(--muted);margin-top:2px;}
.deal .r{text-align:right;}
.deal .r .p{font-size:15px;font-weight:800;}
.deal .r .pl{font-size:12px;font-weight:700;}
.profit{color:var(--green);}
.loss{color:var(--red);}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);font-size:14px;}
.set-row:last-child{border-bottom:none;}
.set-row .k{color:var(--muted);}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%) translateY(-20px);background:var(--card);color:var(--text);padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:300;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{border-color:var(--green);}
.toast.err{border-color:var(--red);}
.toast.warn{border-color:var(--yellow);}
.loading{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.loading.hide{display:none;}
.spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.repair-info{background:var(--card-2);border-radius:12px;padding:12px;font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px;}
.repair-tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:8px;background:rgba(46,204,113,.15);color:var(--green);margin-right:4px;margin-top:4px;}
.repair-buttons{display:flex;flex-direction:column;gap:6px;}
</style>
</head>

</div>

<div class="modal" id="modal"><div class="sheet" id="modalSheet"></div></div>
<div class="toast" id="toast"></div>

/* ===== PROFANITY FILTER ===== */
const BAD_ROOTS = [
  'хуй','хуя','хую','хуе','хуи','хуё','хуйн','пизд','пизж','пзд','бляд','блят','бля','блядь',
  'ебал','ебан','ебуч','ебет','ебёт','ебу','еби','еба','ёб','ебн','сук','сучк','сучар',
  'муд','муда','муди','гандон','гандо','ганду','долбо','долб','залуп','манда','мандав',
  'шлюх','шлюш','пидор','пидар','пидр','педр','педик','наху','ниху','поху','охуе','охуен',
  'охуи','впизд','впизду','отпизд','отху','приху','прихуе','тылох','пшол','пшел','пошелнах',
  'пошёлнах','сосо','соси','соса','сосу','уеб','уёб','уебан','уебищ','хер','херн','херов',
  'жоп','очко','очк','срак','перд','говн'
];

function normalizeText(text) {
  return String(text).toLowerCase()
    .replace(/[^а-яёa-z]/gi, '')
    .replace(/(.)\1{2,}/g, '$1$1')
    .replace(/[aeopxyckbhm]/g, ch => ({
      'a':'а','e':'е','o':'о','p':'р','x':'х','y':'у','c':'с','k':'к',
      'b':'в','h':'н','m':'м','t':'т','n':'п'
    }[ch] || ch));
}

function containsProfanity(text) {
  const normalized = normalizeText(text);
  const words = String(text).toLowerCase().split(/\s+/).map(w => normalizeText(w));
  for (const root of BAD_ROOTS) {
    const r = normalizeText(root);
    if (!r) continue;
    if (normalized.includes(r)) return true;
    for (const w of words) {
      if (w.includes(r) || (r.includes(w) && w.length >= 3)) return true;
    }
  }
  return false;
}

/* ===== STATE ===== */
let state = null;
let activeCategory = 'all';
let currentChatId = null;
let currentChatKind = 'npc';
let saveTimeout = null;
let realtimeChannels = [];
let unreadChats = 0;

function uid() { return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function fmt(n) { return Math.round(n).toLocaleString('ru-RU') + ' ₽'; }
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(text, kind = '') {
  const el = $('#toast');
  el.textContent = text;
  el.className = 'toast show ' + kind;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast ' + kind, 2500);
}

function parseNumber(text) {
  const m = String(text).replace(/\s/g, '').match(/\d{3,}/);
  return m ? parseInt(m[0], 10) : null;
}

function generateMarket() {
  const list = [];
  Object.entries(TEMPLATES).forEach(([cat, items]) => {
    items.forEach(tpl => {
      const archKey = pick(Object.keys(SELLER_ARCHETYPES));
      const arch = SELLER_ARCHETYPES[archKey];
      list.push({
        id: uid(), category: cat, title: tpl.t, desc: tpl.d, image: tpl.i,
        sellerName: pick(NPC_NAMES), archetype: archKey,
        askPrice: Math.round(tpl.m * tpl.ask / 100) * 100,
        marketPrice: tpl.m,
        minPrice: Math.round(tpl.m * Math.max(tpl.min, arch.minMul) / 100) * 100,
        isActive: true, createdAt: Date.now()
      });
    });
  });
  return list.sort(() => Math.random() - .5);
}

function generateOneMarketItem() {
  const cats = Object.keys(TEMPLATES);
  const cat = pick(cats);
  const tpl = pick(TEMPLATES[cat]);
  const archKey = pick(Object.keys(SELLER_ARCHETYPES));
  const arch = SELLER_ARCHETYPES[archKey];
  return {
    id: uid(), category: cat, title: tpl.t, desc: tpl.d, image: tpl.i,
    sellerName: pick(NPC_NAMES), archetype: archKey,
    askPrice: Math.round(tpl.m * tpl.ask / 100) * 100,
    marketPrice: tpl.m,
    minPrice: Math.round(tpl.m * Math.max(tpl.min, arch.minMul) / 100) * 100,
    isActive: true, createdAt: Date.now()
  };
}

function defaultState() {
  return {
    playerId: PLAYER_ID, playerName: PLAYER_NAME,
    balance: 15000,
    market: generateMarket(),
    inventory: [], chats: [], messages: [], deals: [],
    settings: { testMode: true, buyerDelayMin: 10, buyerDelayMax: 60 }
  };
}

async function loadGame() {
  try {
    const cached = localStorage.getItem('perekup_cache_' + PLAYER_ID);
    if (cached) {
      const parsed = JSON.parse(cached);
      if (parsed && parsed.market) return parsed;
    }
  } catch(e) {}
  try {
    const { data, error } = await sb.from('games').select('state').eq('tg_id', PLAYER_ID).maybeSingle();
    if (error) throw error;
    if (data?.state && data.state.market) return data.state;
  } catch(e) {
    console.warn('Supabase load failed:', e);
  }
  return defaultState();
}

function saveGame() {
  if (!state) return;
  localStorage.setItem('perekup_cache_' + PLAYER_ID, JSON.stringify(state));
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try {
      await sb.from('games').upsert({
        tg_id: PLAYER_ID, state: state, updated_at: new Date().toISOString()
      });
    } catch(e) {
      console.warn('Supabase save failed:', e);
    }
  }, 800);
}

  } catch(e) { console.error('switchTab error:', e); }

    ? state.market.filter(m => m.isActive)
    : state.market.filter(m => m.isActive && m.category === activeCategory);

    $('#listings').innerHTML = `<div class="empty"><div class="big">🏪</div>Здесь пока пусто</div>`;
    return;
  }

/* ===== SELLER CHAT (NPC) ===== */
function openSellerChat(listingId) {
  const listing = state.market.find(m => m.id === listingId);
  if (!listing) return;
  let chat = state.chats.find(c => c.kind === 'seller' && c.refId === listingId);
  if (!chat) {
    chat = {
      id: uid(), kind: 'seller', refId: listingId,
      npcName: listing.sellerName, archetype: listing.archetype,
      state: {
        stage: 'idle', lastOffer: null,
        npcLastPrice: listing.askPrice, offersCount: 0,
        agreePrice: null, topic: listing.title
      },
      lastMessage: '', updatedAt: Date.now()
    };
    state.chats.push(chat);
    saveGame();
  }
  currentChatId = chat.id;
  currentChatKind = 'npc';
  openChatView();
}

/* ===== CHAT VIEW ===== */
function openChatView() {
  const chat = state.chats.find(c => c.id === currentChatId);
  if (!chat) return;
  $('#chatName').textContent = chat.npcName;
  const archeLabel = chat.kind === 'seller'
    ? SELLER_ARCHETYPES[chat.archetype].label
    : BUYER_ARCHETYPES[chat.archetype].label;
  $('#chatSub').textContent = archeLabel + ' · ' + chat.state.topic;
  renderMessages();
  renderQuickActions();
  $('#chatview').classList.add('open');
}

function closeChatView() {
  $('#chatview').classList.remove('open');
  currentChatId = null;
  renderChats();
  saveGame();
}

/* ===== MESSAGES ===== */
function chatMessages(chatId) {
  return state.messages.filter(m => m.chatId === chatId);
}

function pushMessage(chatId, sender, text, meta = {}) {
  state.messages.push({ id: uid(), chatId, sender, text, meta, createdAt: Date.now() });
  const chat = state.chats.find(c => c.id === chatId);
  if (chat) { chat.lastMessage = text; chat.updatedAt = Date.now(); }
  saveGame();
}

function renderMessages() {
  const msgs = chatMessages(currentChatId);
  const box = $('#chatMsgs');
  if (!msgs.length) {
    box.innerHTML = `<div class="msg system">Начните диалог — напишите «Привет»</div>`;
    return;
  }
  box.innerHTML = msgs.map(m => {
    const cls = m.sender === 'player' ? 'player' : m.sender === 'system' ? 'system' : 'npc';
    return `<div class="msg ${cls}">${escapeHtml(m.text)}</div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

/* ===== QUICK ACTIONS ===== */
function renderQuickActions() {
  const chat = state.chats.find(c => c.id === currentChatId);
  if (!chat) return;
  const box = $('#chatQuick');
  const btns = [];

  if (chat.kind === 'seller') {
    const st = chat.state;
    if (st.stage === 'idle' || st.stage === 'negotiating') {
      btns.push(`<button data-q="Привет">Привет</button>`);
      btns.push(`<button data-q="Товар ещё продаётся?">Ещё продаётся?</button>`);
      const listing = state.market.find(m => m.id === chat.refId);
      if (listing) {
        const start = Math.round((listing.askPrice * 0.8) / 100) * 100;
        btns.push(`<button data-q="${start}">Предложить ${fmt(start)}</button>`);
      }
    }
    if (st.stage === 'agreed' && st.agreePrice) {
      if (state.balance >= st.agreePrice) {
        btns.push(`<button class="green" data-buy="1">🤝 Купить за ${fmt(st.agreePrice)}</button>`);
      } else {
        btns.push(`<button disabled>Недостаточно средств</button>`);
      }
    }
  } else {
    const st = chat.state;
    if (st.stage === 'buyer_waiting') {
      btns.push(`<button data-q="Да, продаётся">Да</button>`);
      btns.push(`<button data-q="Нет, уже продано">Уже нет</button>`);
    }
    if (st.stage === 'buyer_negotiating') {
      btns.push(`<button data-q="Мало">Мало</button>`);
      if (st.buyerLastOffer) btns.push(`<button data-q="Согласен">Согласен</button>`);
    }
    if (st.stage === 'buyer_agreed' && st.agreePrice) {
      btns.push(`<button class="green" data-sell="1">🤝 Продать за ${fmt(st.agreePrice)}</button>`);
    }
  }

  box.innerHTML = btns.join('');
  $$('#chatQuick button').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.buy)  return finalizeBuy();
      if (b.dataset.sell) return finalizeSell();
      sendPlayerMessage(b.dataset.q);
    });
  });
}

/* ===== SEND (NPC) ===== */
function sendPlayerMessage(text) {
  if (containsProfanity(text)) {
    toast('Будьте вежливее, тогда сообщение отправится', 'warn');
    return;
  }
  const chat = state.chats.find(c => c.id === currentChatId);
  if (!chat) return;
  if (['done','refused','buyer_done','buyer_completed'].includes(chat.state.stage)) {
    toast('Сделка уже завершена');
    return;
  }
  const num = parseNumber(text);
  pushMessage(chat.id, 'player', text, num ? { offer: num } : {});
  renderMessages();
  setTimeout(() => {
    const reply = chat.kind === 'seller'
      ? sellerReply(chat, text, num)
      : buyerReply(chat, text, num);
    if (reply) {
      pushMessage(chat.id, 'npc', reply.text, reply.meta || {});
      renderMessages();
      renderQuickActions();
    }
  }, 500 + Math.random() * 700);
}

/* ===== SELLER REPLY ===== */
function sellerReply(chat, text, offerNum) {
  const listing = state.market.find(m => m.id === chat.refId);
  if (!listing) return { text: 'Товар уже снят с продажи.' };
  const st = chat.state;
  const arche = SELLER_ARCHETYPES[chat.archetype];
  const t = text.toLowerCase();

  const isAgree = /договорились|согласен|согласна|беру|берём|ок|окей|хорошо|давай|по рукам|годится|идет|идёт/i.test(t);
  if (isAgree && (st.stage === 'negotiating' || st.stage === 'idle')) {
    if (st.agreePrice) {
      st.stage = 'agreed';
      return { text: `Отлично, по рукам! ${fmt(st.agreePrice)}. Жми кнопку «Купить».`, meta: { agree: st.agreePrice } };
    }
    st.agreePrice = st.npcLastPrice;
    st.stage = 'agreed';
    return { text: `Хорошо, ${fmt(st.agreePrice)}. Жми кнопку «Купить».`, meta: { agree: st.agreePrice } };
  }

  if (/привет|здравств|добрый|хай|hi|hello/.test(t) && !offerNum && st.stage === 'idle') {
    st.stage = 'negotiating';
    return { text: `${pick(arche.phrases)} Товар — «${listing.title}», цена ${fmt(listing.askPrice)}.` };
  }
  if (/прода|актуальн|есть|в наличии/.test(t) && !offerNum) {
    if (st.stage === 'idle') st.stage = 'negotiating';
    return { text: `Да, товар ещё есть. Цена ${fmt(st.npcLastPrice)}.` };
  }
  if (offerNum) {
    st.offersCount++;
    st.lastOffer = offerNum;
    if (offerNum < listing.minPrice) {
      if (st.offersCount >= arche.maxOffers && (chat.archetype === 'stubborn' || chat.archetype === 'greedy')) {
        st.stage = 'refused';
        return { text: 'Слушай, это слишком мало. Не договоримся.', meta: { refused: true } };
      }
      const counter = Math.round((listing.minPrice + st.npcLastPrice) / 2 / 100) * 100;
      st.npcLastPrice = Math.min(st.npcLastPrice, counter);
      return { text: `${fmt(offerNum)} — маловато будет. Могу уступить до ${fmt(counter)}.`, meta: { counter } };
    }
    if (offerNum < st.npcLastPrice) {
      const step = arche.stepMul[Math.min(st.offersCount - 1, arche.stepMul.length - 1)];
      const newPrice = Math.max(listing.minPrice,
        Math.round((st.npcLastPrice - listing.askPrice * step) / 100) * 100);
      if (Math.abs(newPrice - offerNum) <= listing.askPrice * 0.02) {
        st.agreePrice = offerNum;
        st.stage = 'negotiating';
        return { text: `Ладно, давай ${fmt(offerNum)} и по рукам. Напиши «договорились».`, meta: { agree: offerNum } };
      }
      st.npcLastPrice = newPrice;
      return { text: `${fmt(offerNum)} мало. Могу уступить до ${fmt(newPrice)}.`, meta: { counter: newPrice } };
    }
    if (offerNum >= st.npcLastPrice) {
      st.agreePrice = st.npcLastPrice;
      st.stage = 'negotiating';
      return { text: `Да без проблем, ${fmt(st.npcLastPrice)}. Пиши «договорились».`, meta: { agree: st.npcLastPrice } };
    }
  }
  if (st.stage === 'refused') return { text: 'Мы уже закончили обсуждение.' };
  if (st.stage === 'idle') {
    st.stage = 'negotiating';
    return { text: pick(arche.phrases) + ` Товар: «${listing.title}». Цена — ${fmt(st.npcLastPrice)}.` };
  }
  return { text: pick([
    `Ну так что, берёшь за ${fmt(st.npcLastPrice)}?`,
    `Моя цена — ${fmt(st.npcLastPrice)}.`,
    `Слушаю, какие предложения?`,
    `Готов обсудить.`
  ]) };
}

/* ===== BUYER REPLY ===== */
function buyerReply(chat, text, offerNum) {
  const inv = state.inventory.find(i => i.id === chat.refId);
  if (!inv) return { text: 'Что-то не найду объявление...' };
  const st = chat.state;
  const arche = BUYER_ARCHETYPES[chat.archetype];
  const t = text.toLowerCase();
  const listedPrice = inv.listedPrice;

  const isAgree = /договорились|согласен|согласна|продаю|продам|беру|берём|ок|окей|хорошо|давай|по рукам|годится/i.test(t);
  if (isAgree && st.stage === 'buyer_negotiating' && st.buyerLastOffer) {
    st.agreePrice = st.buyerLastOffer;
    st.stage = 'buyer_agreed';
    return { text: `Отлично, забираю за ${fmt(st.agreePrice)}!`, meta: { agree: st.agreePrice } };
  }
  if (/да|есть|продаётся|актуальн/.test(t) && st.stage === 'buyer_waiting') {
    st.stage = 'buyer_negotiating';
    const first = Math.round(listedPrice * (0.85 + Math.random() * 0.1) / 100) * 100;
    st.buyerLastOffer = first;
    st.maxBudget = Math.round(listedPrice * arche.maxMul / 100) * 100;
    return { text: `Отлично! Готов забрать за ${fmt(first)}.`, meta: { offer: first } };
  }
  if (/нет|уже нет|продано/.test(t) && st.stage === 'buyer_waiting') {
    st.stage = 'buyer_done';
    return { text: 'Понял, извините за беспокойство.' };
  }
  if (/мало|дорого|дешевле/.test(t) && st.stage === 'buyer_negotiating') {
    st.offersCount++;
    const step = arche.stepMul[Math.min(st.offersCount - 1, arche.stepMul.length - 1)];
    let next = Math.round((st.buyerLastOffer + listedPrice * step) / 100) * 100;
    if (next > st.maxBudget) {
      if (st.offersCount >= arche.maxOffers) {
        st.stage = 'buyer_done';
        return { text: 'Дорого для меня. Подумаю.' };
      }
      next = st.maxBudget;
    }
    if (next >= listedPrice) {
      st.agreePrice = listedPrice;
      st.stage = 'buyer_agreed';
      return { text: `Хорошо, беру по вашей цене — ${fmt(listedPrice)}!`, meta: { agree: listedPrice } };
    }
    st.buyerLastOffer = next;
    return { text: `Тогда ${fmt(next)}. Это моя лучшая цена.`, meta: { offer: next } };
  }
  if (offerNum && st.stage === 'buyer_negotiating') {
    if (offerNum <= st.buyerLastOffer) {
      st.agreePrice = offerNum;
      st.stage = 'buyer_agreed';
      return { text: `Беру за ${fmt(offerNum)}!`, meta: { agree: offerNum } };
    }
    if (offerNum > st.maxBudget) {
      st.offersCount++;
      if (st.offersCount >= arche.maxOffers) {
        st.stage = 'buyer_done';
        return { text: 'Дороговато для меня.' };
      }
      return { text: `Дорого, могу максимум ${fmt(st.maxBudget)}.`, meta: { offer: st.maxBudget } };
    }
    st.buyerLastOffer = offerNum;
    return { text: `Хорошо, ${fmt(offerNum)} — жми кнопку продажи.`, meta: { agree: offerNum } };
  }
  return { text: pick(['Так что по цене?', 'Готов забрать, если сойдёмся.', 'Слушаю вас.']) };
}

/* ===== FINALIZE BUY ===== */
function finalizeBuy() {
  const chat = state.chats.find(c => c.id === currentChatId);
  if (!chat || chat.kind !== 'seller') return;
  const listing = state.market.find(m => m.id === chat.refId);
  const price = chat.state.agreePrice;
  if (!listing || !price) return;
  if (state.balance < price) return toast('Недостаточно средств', 'err');

  state.balance -= price;
  listing.isActive = false;
  state.inventory.push({
    id: uid(), title: listing.title, category: listing.category,
    image: listing.image, buyPrice: price, marketPrice: listing.marketPrice,
    status: 'owned', listedPrice: null,
    repairSpent: 0, repairBoost: 0, repairs: [],
    createdAt: Date.now()
  });
  state.deals.push({ id: uid(), kind: 'buy', title: listing.title, price, profit: 0, createdAt: Date.now() });
  chat.state.stage = 'done';
  pushMessage(chat.id, 'system', `Сделка закрыта. Куплено за ${fmt(price)}.`);
  pushMessage(chat.id, 'npc', 'Отлично, договорились!');

  saveGame();
  renderBalance();
  renderMessages();
  renderQuickActions();
  toast('Куплено: ' + listing.title, 'ok');
}

/* ===== FINALIZE SELL (NPC buyer) ===== */
function finalizeSell() {
  const chat = state.chats.find(c => c.id === currentChatId);
  if (!chat || chat.kind !== 'buyer') return;
  const inv = state.inventory.find(i => i.id === chat.refId);
  const price = chat.state.agreePrice;
  if (!inv || !price) return;

  const profit = price - inv.buyPrice - (inv.repairSpent || 0);
  state.balance += price;
  inv.status = 'sold';

  state.deals.push({ id: uid(), kind: 'sell', title: inv.title, price, profit, createdAt: Date.now() });
  chat.state.stage = 'buyer_completed';
  pushMessage(chat.id, 'system', `Продано за ${fmt(price)}. Прибыль: ${profit >= 0 ? '+' : ''}${fmt(profit)}.`);
  pushMessage(chat.id, 'npc', 'Спасибо! Всё отлично, товар забрал.');

  saveGame();
  renderBalance();
  renderMessages();
  renderQuickActions();
  toast(`Продано! ${profit >= 0 ? 'Прибыль' : 'Убыток'}: ${fmt(Math.abs(profit))}`, profit >= 0 ? 'ok' : 'err');
}

/* ===== INVENTORY ===== */
function renderInventory() {
  const owned = state.inventory.filter(i => i.status !== 'sold');
  if (!owned.length) {
    $('#inventory').innerHTML = `<div class="empty"><div class="big">📦</div>У вас пока нет товаров.<br>Купите что-нибудь на рынке.</div>`;
    return;
  }
  $('#inventory').innerHTML = owned.map(it => {
    const statusText =
      it.status === 'owned'  ? 'Не выставлен' :
      it.status === 'listed' ? (it.hasTalks ? '💬 Есть переговоры' : '🔎 Ищем покупателя') :
      it.status;
    const canList = it.status === 'owned';
    return `
      <div class="card listing">
        <div class="thumb">${it.image}</div>
        <div class="info">
          <div class="title">${escapeHtml(it.title)}</div>
          <div class="desc">Куплено за ${fmt(it.buyPrice)}${it.repairSpent ? ' · ремонт ' + fmt(it.repairSpent) : ''}</div>
          <div class="prices">
            <span class="price-ask">${it.listedPrice ? fmt(it.listedPrice) : '—'}</span>
            <span class="price-mkt">${fmt(it.marketPrice)}</span>
          </div>
          <div class="seller">Статус: ${statusText}</div>
          <button class="btn sm ${canList ? '' : 'ghost'}" data-list="${it.id}" ${canList ? '' : 'disabled'}>
            ${canList ? '💰 Продать' : '✅ Уже выставлен'}
          </button>
          ${!canList ? `<button class="btn sm red" data-unlist="${it.id}" style="margin-top:6px;">❌ Снять с продажи</button>` : ''}
        </div>
      </div>`;
  }).join('');
  $$('[data-list]').forEach(b => b.addEventListener('click', () => openListModal(b.dataset.list)));
  $$('[data-unlist]').forEach(b => b.addEventListener('click', () => unlistItem(b.dataset.unlist)));
}

/* ===== UNLIST ===== */
function unlistItem(invId) {
  const inv = state.inventory.find(i => i.id === invId);
  if (!inv || inv.status !== 'listed') return;
  if (!confirm(`Снять «${inv.title}» с продажи?`)) return;

  if (inv.onlineListingId) {
    sb.from('online_listings').delete().eq('id', inv.id).then(() => {});
  }

  inv.status = 'owned';
  inv.listedPrice = null;
  inv.listedAt = null;
  inv.onlineListingId = null;
  inv.hasTalks = false;
  inv.buyerScheduled = false;

  state.chats = state.chats.filter(c => !(c.kind === 'buyer' && c.refId === inv.id));

  saveGame();
  renderInventory();
  toast('Снято с продажи', 'ok');
}

/* ===== LIST MODAL ===== */
function openListModal(invId) {
  const inv = state.inventory.find(i => i.id === invId);
  if (!inv) return;
  const recommended = Math.round(inv.marketPrice * 1.05 / 100) * 100;
  const maxAllowed = Math.round(inv.marketPrice * 2.5 / 100) * 100;
  const totalCost = (inv.buyPrice || 0) + (inv.repairSpent || 0);

  $('#modalSheet').innerHTML = `
    <h3>Выставить «${escapeHtml(inv.title)}»</h3>
    <div class="cost-info">
      Куплено: <b>${fmt(inv.buyPrice)}</b><br>
      ${inv.repairSpent ? `Ремонт: <b>${fmt(inv.repairSpent)}</b><br>` : ''}
      Себестоимость: <b>${fmt(totalCost)}</b><br>
      Рыночная цена: <b>${fmt(inv.marketPrice)}</b><br>
      <span style="color:var(--yellow);">Максимум: ${fmt(maxAllowed)} (×2.5 от рынка)</span>
    </div>
    <input id="listPrice" type="number" value="${recommended}" placeholder="Цена" />
    <button class="btn" id="doList">✅ Выставить на рынке (NPC)</button>
    <button class="btn green" id="doListOnline" style="margin-top:8px;">🌐 Выставить в онлайн</button>
    <button class="btn ghost" id="cancelList" style="margin-top:8px;">Отмена</button>
  `;
  $('#modal').classList.add('open');

  $('#cancelList').addEventListener('click', closeModal);
  $('#doList').addEventListener('click', () => {
    const v = parseInt($('#listPrice').value, 10);
    if (!v || v < 100) return toast('Укажите цену', 'err');
    if (v > maxAllowed) {
      toast(`Максимум ${fmt(maxAllowed)} (×2.5 от рынка)`, 'err');
      return;
    }
    inv.status = 'listed';
    inv.listedPrice = v;
    inv.listedAt = Date.now();
    inv.hasTalks = false;
    inv.onlineListingId = null;
    scheduleBuyerForInventory(inv.id);
    saveGame();
    closeModal();
    renderInventory();
    toast('Выставлено на рынке NPC', 'ok');
  });

  $('#doListOnline').addEventListener('click', async () => {
    const v = parseInt($('#listPrice').value, 10);
    if (!v || v < 100) return toast('Укажите цену', 'err');
    if (v > maxAllowed) {
      toast(`Максимум ${fmt(maxAllowed)} (×2.5 от рынка)`, 'err');
      return;
    }
    await publishToOnline(inv, v);
  });
}

function closeModal() { $('#modal').classList.remove('open'); }

/* ===== PUBLISH TO ONLINE ===== */
async function publishToOnline(inv, price) {
  try {
    const { error } = await sb.from('online_listings').insert({
      id: inv.id, seller_id: PLAYER_ID, seller_name: PLAYER_NAME,
      title: inv.title, description: 'Продаётся игроком',
      image: inv.image, category: inv.category,
      price: price, market_price: inv.marketPrice, status: 'active'
    });
    if (error) throw error;
    inv.status = 'listed';
    inv.listedPrice = price;
    inv.listedAt = Date.now();
    inv.onlineListingId = inv.id;
    inv.hasTalks = false;
    saveGame();
    closeModal();
    renderInventory();
    toast('Выставлено в онлайн!', 'ok');
  } catch(e) {
    console.error(e);
    toast('Ошибка публикации: ' + e.message, 'err');
  }
}

/* ===== ONLINE TAB ===== */
async function renderOnline() {

  try {

/* ===== P2P ===== */
async function openP2PChat(listingId) {
  try {
    const { data: listing } = await sb.from('online_listings').select('*').eq('id', listingId).maybeSingle();
    if (!listing) return toast('Объявление не найдено', 'err');

    let { data: existing } = await sb.from('p2p_chats')
      .select('*').eq('seller_id', listing.seller_id)
      .eq('buyer_id', PLAYER_ID).eq('listing_id', listingId).maybeSingle();

    if (!existing) {
      const { data: created, error } = await sb.from('p2p_chats').insert({
        seller_id: listing.seller_id, buyer_id: PLAYER_ID,
        buyer_name: PLAYER_NAME, listing_id: listingId,
        listing_title: listing.title, listing_image: listing.image,
        listing_price: listing.price, status: 'active'
      }).select().single();
      if (error) throw error;
      existing = created;
      await sb.from('p2p_messages').insert({
        chat_id: existing.id, sender_id: PLAYER_ID,
        sender_name: PLAYER_NAME, text: 'Здравствуйте! Товар ещё продаётся?'
      });
    }
    currentChatId = existing.id;
    currentChatKind = 'p2p';
    await openP2PChatView(existing);
  } catch(e) {
    console.error(e);
    toast('Ошибка: ' + e.message, 'err');
  }
}

async function openP2PChatView(chat) {
  $('#chatName').textContent = chat.seller_id === PLAYER_ID ? 'Покупатель' : (chat.buyer_name || 'Покупатель');
  $('#chatSub').textContent = '👤 Реальный игрок · ' + chat.listing_title;
  await renderP2PMessages(chat.id);
  renderP2PQuickActions(chat);
  $('#chatview').classList.add('open');

  const channel = sb.channel('p2p_msgs_' + chat.id)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'p2p_messages', filter: `chat_id=eq.${chat.id}` },
      payload => {
        if (payload.new.sender_id !== PLAYER_ID) {
          renderP2PMessages(chat.id);
          if (!$('#chatview').classList.contains('open')) {
            unreadChats++;
            updateChatsDot();
          }
        }
      }).subscribe();
  realtimeChannels.push(channel);
}

async function renderP2PMessages(chatId) {
  const { data } = await sb.from('p2p_messages')
    .select('*').eq('chat_id', chatId).order('created_at', { ascending: true });
  const box = $('#chatMsgs');
  if (!data || !data.length) {
    box.innerHTML = `<div class="msg system">Сообщений пока нет</div>`;
    return;
  }
  box.innerHTML = data.map(m => {
    const isMe = m.sender_id === PLAYER_ID;
    const cls = isMe ? 'player' : 'other';
    return `<div class="msg ${cls}">
      ${!isMe ? `<div class="msg-name">${escapeHtml(m.sender_name || 'Игрок')}</div>` : ''}
      ${escapeHtml(m.text)}
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function renderP2PQuickActions(chat) {
  const box = $('#chatQuick');
  const btns = [];
  const isSeller = chat.seller_id === PLAYER_ID;

  if (chat.status === 'active') {
    if (!isSeller) {
      btns.push(`<button data-p2p="Здравствуйте! Товар ещё продаётся?">Привет</button>`);
      btns.push(`<button data-p2p="${chat.listing_price}">Предложить ${fmt(chat.listing_price)}</button>`);
      btns.push(`<button class="green" data-p2p-action="agree">Договорились</button>`);
    } else {
      btns.push(`<button data-p2p="Да, продаётся">Да</button>`);
      btns.push(`<button data-p2p="Моя цена окончательная">Цена окончательная</button>`);
    }
  }
  if (chat.status === 'agreed_by_buyer' && isSeller) {
    btns.push(`<button class="green" data-p2p-action="sell">🤝 Продать за ${fmt(chat.agreed_price || chat.listing_price)}</button>`);
    btns.push(`<button class="red" data-p2p-action="decline">Отказать</button>`);
  }
  if (chat.status === 'agreed_by_buyer' && !isSeller) {
    btns.push(`<button disabled>Ждём ответ продавца...</button>`);
  }
  if (chat.status === 'completed') {
    btns.push(`<button disabled>✅ Сделка завершена</button>`);
  }
  if (chat.status === 'declined') {
    btns.push(`<button disabled>❌ Продавец отказал</button>`);
  }

  box.innerHTML = btns.join('');
  $$('#chatQuick button').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.p2pAction) return handleP2PAction(b.dataset.p2pAction, chat);
      if (b.dataset.p2p) return sendP2PMessage(chat, b.dataset.p2p);
    });
  });
}

async function sendP2PMessage(chat, text) {
  if (containsProfanity(text)) {
    toast('Будьте вежливее, тогда сообщение отправится', 'warn');
    return;
  }
  try {
    await sb.from('p2p_messages').insert({
      chat_id: chat.id, sender_id: PLAYER_ID,
      sender_name: PLAYER_NAME, text: text
    });
    await renderP2PMessages(chat.id);
  } catch(e) {
    toast('Ошибка отправки', 'err');
  }
}

async function handleP2PAction(action, chat) {
  if (action === 'agree') {
    const lastPrice = chat.listing_price;
    await sb.from('p2p_chats').update({
      status: 'agreed_by_buyer', agreed_price: lastPrice,
      updated_at: new Date().toISOString()
    }).eq('id', chat.id);
    await sb.from('p2p_messages').insert({
      chat_id: chat.id, sender_id: PLAYER_ID, sender_name: PLAYER_NAME,
      text: `Договорились на ${fmt(lastPrice)}!`
    });
    toast('Отправлено продавцу', 'ok');
    const { data: fresh } = await sb.from('p2p_chats').select('*').eq('id', chat.id).maybeSingle();
    if (fresh) renderP2PQuickActions(fresh);
    await renderP2PMessages(chat.id);
    return;
  }

  if (action === 'sell') {
    const price = chat.agreed_price || chat.listing_price;
    try {
      await sb.from('p2p_messages').insert({
        chat_id: chat.id, sender_id: PLAYER_ID, sender_name: PLAYER_NAME,
        text: `Продано! Сделка завершена за ${fmt(price)}.`
      });
      await sb.from('p2p_chats').update({
        status: 'completed', updated_at: new Date().toISOString()
      }).eq('id', chat.id);
      await sb.from('online_listings').update({ status: 'sold' }).eq('id', chat.listing_id);

      state.balance += price;
      const inv = state.inventory.find(i => i.id === chat.listing_id);
      if (inv) {
        inv.status = 'sold';
        const profit = price - inv.buyPrice - (inv.repairSpent || 0);
        state.deals.push({ id: uid(), kind: 'sell', title: inv.title, price, profit, createdAt: Date.now() });
      }
      saveGame();
      renderBalance();
      toast(`Продано за ${fmt(price)}!`, 'ok');
      const { data: fresh } = await sb.from('p2p_chats').select('*').eq('id', chat.id).maybeSingle();
      if (fresh) renderP2PQuickActions(fresh);
      await renderP2PMessages(chat.id);
    } catch(e) {
      toast('Ошибка: ' + e.message, 'err');
    }
    return;
  }

  if (action === 'decline') {
    await sb.from('p2p_messages').insert({
      chat_id: chat.id, sender_id: PLAYER_ID, sender_name: PLAYER_NAME,
      text: 'Извините, передумал продавать.'
    });
    await sb.from('p2p_chats').update({
      status: 'declined', updated_at: new Date().toISOString()
    }).eq('id', chat.id);
    toast('Отказано');
    const { data: fresh } = await sb.from('p2p_chats').select('*').eq('id', chat.id).maybeSingle();
    if (fresh) renderP2PQuickActions(fresh);
    await renderP2PMessages(chat.id);
  }
}

async function loadP2PChats() {
  try {
    const { data } = await sb.from('p2p_chats').select('*')
      .or(`seller_id.eq.${PLAYER_ID},buyer_id.eq.${PLAYER_ID}`)
      .order('updated_at', { ascending: false });
    return data || [];
  } catch(e) { return []; }
}

/* ===== CHATS LIST ===== */
async function renderChats() {
  const npcChats = state.chats;
  const p2pChats = await loadP2PChats();
  const all = [
    ...npcChats.map(c => ({ ...c, source: 'npc' })),
    ...p2pChats.map(c => ({
      id: c.id, source: 'p2p',
      kind: c.seller_id === PLAYER_ID ? 'p2p_seller' : 'p2p_buyer',
      npcName: c.seller_id === PLAYER_ID ? (c.buyer_name || 'Покупатель') : 'Продавец',
      archetype: null, lastMessage: c.listing_title,
      updatedAt: new Date(c.updated_at).getTime(),
      state: { topic: c.listing_title, stage: c.status }
    }))
  ].sort((a, b) => b.updatedAt - a.updatedAt);

  if (!all.length) {
    $('#chats').innerHTML = `<div class="empty"><div class="big">💬</div>Пока нет чатов.<br>Напишите продавцу на рынке или выставьте товар.</div>`;
    return;
  }

  $('#chats').innerHTML = all.map(c => {
    let archeLabel = '';
    if (c.source === 'npc') {
      archeLabel = c.kind === 'seller'
        ? SELLER_ARCHETYPES[c.archetype]?.label || ''
        : BUYER_ARCHETYPES[c.archetype]?.label || '';
    } else {
      archeLabel = c.kind === 'p2p_seller' ? '👤 Покупатель' : '👤 Продавец';
    }
    let badge = '';
    if (c.source === 'p2p') {
      if (c.state.stage === 'agreed_by_buyer' && c.kind === 'p2p_seller') badge = '<span class="badge hot">Продать</span>';
      else if (c.state.stage === 'completed') badge = '<span class="badge online">Завершено</span>';
      else badge = '<span class="badge online">Онлайн</span>';
    } else {
      if (c.kind === 'buyer' && c.state.stage === 'buyer_agreed') badge = '<span class="badge hot">Продать</span>';
      else if (c.kind === 'seller' && c.state.stage === 'agreed') badge = '<span class="badge hot">Купить</span>';
      else if (c.state.stage?.startsWith('buyer_')) badge = '<span class="badge new">Покупатель</span>';
    }
    return `
      <div class="card chat-row" data-chat="${c.id}" data-source="${c.source}">
        <div class="chat-avatar ${c.source === 'p2p' ? 'online' : ''}">
          ${c.source === 'p2p' ? '👤' : (c.kind === 'seller' ? '🏪' : '👤')}
        </div>
        <div class="chat-meta">
          <div class="name">${escapeHtml(c.npcName)} · ${archeLabel}</div>
          <div class="last">${escapeHtml(c.lastMessage || 'Начните диалог')}</div>
        </div>
        ${badge}
      </div>`;
  }).join('');

  $$('[data-chat]').forEach(el => el.addEventListener('click', async () => {
    if (el.dataset.source === 'npc') {
      currentChatId = el.dataset.chat;
      currentChatKind = 'npc';
      openChatView();
    } else {
      const { data } = await sb.from('p2p_chats').select('*').eq('id', el.dataset.chat).maybeSingle();
      if (data) {
        currentChatId = data.id;
        currentChatKind = 'p2p';
        await openP2PChatView(data);
      }
    }
  }));
}

/* ===== REPAIR ===== */
function renderRepair() {
  const owned = state.inventory.filter(i => i.status !== 'sold');
  if (!owned.length) {
    $('#repair').innerHTML = `<div class="empty"><div class="big">🔧</div>Нечего ремонтировать.<br>Купите товар на рынке.</div>`;
    return;
  }
  $('#repair').innerHTML = `
    <div class="repair-info">💡 Ремонт даёт <b>фиксированную прибавку к цене</b>. Цена самого ремонта не растёт.</div>
  ` + owned.map(it => {
    const spent = it.repairSpent || 0;
    const boost = it.repairBoost || 0;
    const itemRepairs = it.repairs || [];
    const availableKeys = REPAIR_BY_CATEGORY[it.category] || REPAIR_BY_CATEGORY.other;
    const repairButtons = availableKeys.map(key => {
      const def = REPAIR_TYPES[key];
      if (!def) return '';
      const canAfford = state.balance >= def.cost;
      return `<button class="btn sm ${canAfford ? '' : 'ghost'}"
        data-repair="${key}" data-item="${it.id}" ${canAfford ? '' : 'disabled'}>
        ${def.label} — ${fmt(def.cost)} <span style="opacity:.7;font-size:11px;">(+${fmt(def.boost)})</span>
      </button>`;
    }).join('');
    const historyHtml = itemRepairs.length
      ? `<div style="margin-top:8px;">${itemRepairs.map(r =>
          `<span class="repair-tag">${REPAIR_TYPES[r]?.label || r}</span>`).join('')}</div>`
      : '';
    return `
      <div class="card">
        <div class="listing" style="margin-bottom:12px;">
          <div class="thumb">${it.image}</div>
          <div class="info">
            <div class="title">${escapeHtml(it.title)}</div>
            <div class="desc">Куплено за ${fmt(it.buyPrice)}</div>
            <div class="prices">
              <span class="price-ask">${fmt(it.marketPrice)}</span>
              ${boost > 0 ? `<span style="color:var(--green);font-size:12px;">+${fmt(boost)}</span>` : ''}
            </div>
            <div class="seller">💸 Вложено: ${fmt(spent)}${boost > 0 ? ` · 📈 +${fmt(boost)}` : ''}</div>
            ${historyHtml}
          </div>
        </div>
        <div class="repair-buttons">${repairButtons}</div>
      </div>`;
  }).join('');
  $$('[data-repair]').forEach(b => b.addEventListener('click', () => doRepair(b.dataset.item, b.dataset.repair)));
}

function doRepair(itemId, repairKey) {
  const inv = state.inventory.find(i => i.id === itemId);
  if (!inv) return;
  const def = REPAIR_TYPES[repairKey];
  if (!def) return;
  if (state.balance < def.cost) return toast('Недостаточно средств', 'err');

  state.balance -= def.cost;
  inv.repairBoost = (inv.repairBoost || 0) + def.boost;
  inv.marketPrice += def.boost;
  inv.repairSpent = (inv.repairSpent || 0) + def.cost;
  inv.repairs = inv.repairs || [];
  inv.repairs.push(repairKey);

  saveGame();
  renderBalance();
  renderRepair();
  toast(`${def.label} готово! +${fmt(def.boost)} к цене`, 'ok');
}

/* ===== HISTORY ===== */
function renderHistory() {
  const deals = [...state.deals].sort((a, b) => b.createdAt - a.createdAt);
  if (!deals.length) {
    $('#history').innerHTML = `<div class="empty"><div class="big">📊</div>История пуста.</div>`;
    return;
  }
  const total = deals.filter(d => d.kind === 'sell').reduce((s, d) => s + (d.profit || 0), 0);
  const head = `
    <div class="card" style="text-align:center;">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">Общая прибыль</div>
      <div class="${total >= 0 ? 'profit' : 'loss'}" style="font-size:26px;font-weight:800;">
        ${total >= 0 ? '+' : ''}${fmt(total)}
      </div>
    </div>`;
  const list = deals.map(d => {
    const isBuy = d.kind === 'buy';
    const date = new Date(d.createdAt).toLocaleString('ru-RU',
      { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    let right = '';
    if (isBuy) right = `<div class="p">-${fmt(d.price)}</div><div class="d">Покупка</div>`;
    else {
      const p = d.profit || 0;
      right = `<div class="p">+${fmt(d.price)}</div>
               <div class="pl ${p >= 0 ? 'profit' : 'loss'}">${p >= 0 ? '+' : ''}${fmt(p)}</div>`;
    }
    return `<div class="card deal">
      <div class="l">
        <div class="t">${isBuy ? '🛒' : '💰'} ${escapeHtml(d.title)}</div>
        <div class="d">${date}</div>
      </div>
      <div class="r">${right}</div>
    </div>`;
  }).join('');
  $('#history').innerHTML = head + list;
}

/* ===== SETTINGS ===== */
function renderSettings() {
  const s = state.settings;
  $('#settings').innerHTML = `
    <div class="set-row"><span class="k">Игрок</span><span>${escapeHtml(PLAYER_NAME)}</span></div>
    <div class="set-row"><span class="k">ID</span><span style="font-size:12px;">${PLAYER_ID}</span></div>
    <div class="set-row"><span class="k">Баланс</span><span><b>${fmt(state.balance)}</b></span></div>
    <div class="set-row"><span class="k">Сделок всего</span><span>${state.deals.length}</span></div>
    <div class="set-row"><span class="k">Тестовый режим (быстрые покупатели)</span>
      <button class="btn sm ghost" id="toggleTest" style="width:auto;">${s.testMode ? 'ВКЛ' : 'ВЫКЛ'}</button>
    </div>
    <div class="set-row"><span class="k">Сбросить прогресс</span>
      <button class="btn sm red" id="reset" style="width:auto;">Сбросить</button>
    </div>
  `;
  $('#toggleTest').addEventListener('click', () => {
    s.testMode = !s.testMode;
    saveGame();
    renderSettings();
    toast('Тестовый режим: ' + (s.testMode ? 'ВКЛ' : 'ВЫКЛ'));
  });
  $('#reset').addEventListener('click', async () => {
    if (!confirm('Удалить весь прогресс?')) return;
    try {
      await sb.from('games').delete().eq('tg_id', PLAYER_ID);
      await sb.from('online_listings').delete().eq('seller_id', PLAYER_ID);
    } catch(e) {}
    localStorage.removeItem('perekup_cache_' + PLAYER_ID);
    location.reload();
  });
}

/* ===== BACKGROUND LOOPS ===== */
function startBuyerLoop() {
  setInterval(() => {
    state.inventory.filter(i => i.status === 'listed').forEach(inv => {
      if (inv.listedPrice > inv.marketPrice * 2.5) return;
      if (inv.onlineListingId) return;
      const hasChat = state.chats.some(c => c.kind === 'buyer' && c.refId === inv.id
        && !['buyer_done', 'buyer_completed'].includes(c.state.stage));
      if (!hasChat && Math.random() < 0.15) createBuyerChat(inv);
    });
  }, 30000);
}

function startMarketLoop() {
  setInterval(() => {
    if (!state) return;
    const now = Date.now();
    const active = state.market.filter(m => m.isActive);
    const fresh = active.filter(m => now - (m.createdAt || 0) < 20 * 60 * 1000);
    if (fresh.length < 15) {
      const toAdd = 1 + Math.floor(Math.random() * 2);
      for (let i = 0; i < toAdd; i++) state.market.push(generateOneMarketItem());
    }
    state.market = state.market.filter(m => m.isActive).slice(-40);
    saveGame();
    if ($('#tab-market').classList.contains('active')) renderMarket();
  }, 30000);
}

function startBuyerForInventory() {
  state.inventory.filter(i => i.status === 'listed' && !i.onlineListingId && !i.buyerScheduled).forEach(inv => {
    inv.buyerScheduled = true;
    scheduleBuyerForInventory(inv.id);
  });
}

/* ===== BUYER SCHEDULER ===== */
function scheduleBuyerForInventory(invId) {
  const inv = state.inventory.find(i => i.id === invId);
  if (!inv || inv.status !== 'listed') return;
  if (inv.listedPrice > inv.marketPrice * 2.5) return;

  const minSec = state.settings.testMode ? 5 : state.settings.buyerDelayMin * 60;
  const maxSec = state.settings.testMode ? 25 : state.settings.buyerDelayMax * 60;
  const delayMs = (minSec + Math.random() * (maxSec - minSec)) * 1000;

  setTimeout(() => {
    const fresh = state.inventory.find(i => i.id === invId);
    if (!fresh || fresh.status !== 'listed') return;
    const overprice = fresh.listedPrice / fresh.marketPrice;
    let chance;
    if (overprice <= 0.8) chance = 1.00;
    else if (overprice <= 1.0) chance = 0.90;
    else if (overprice <= 1.15) chance = 0.65;
    else if (overprice <= 1.30) chance = 0.35;
    else if (overprice <= 1.50) chance = 0.12;
    else if (overprice <= 2.00) chance = 0.04;
    else chance = 0.00;
    if (overprice > 2.5) return;
    if (Math.random() > chance) { scheduleBuyerForInventory(invId); return; }
    createBuyerChat(fresh);
  }, delayMs);
}

function createBuyerChat(inv) {
  if (inv.listedPrice > inv.marketPrice * 2.5) return;
  const archetypeKey = pick(Object.keys(BUYER_ARCHETYPES));
  const arche = BUYER_ARCHETYPES[archetypeKey];
  const name = pick(NPC_NAMES);
  const chat = {
    id: uid(), kind: 'buyer', refId: inv.id, npcName: name,
    archetype: archetypeKey,
    state: {
      stage: 'buyer_waiting', topic: inv.title,
      listedPrice: inv.listedPrice, buyerLastOffer: null,
      maxBudget: Math.round(inv.listedPrice * arche.maxMul / 100) * 100,
      offersCount: 0, agreePrice: null
    },
    lastMessage: '', updatedAt: Date.now()
  };
  state.chats.push(chat);
  inv.hasTalks = true;
  pushMessage(chat.id, 'npc', pick(arche.greeting));
  saveGame();
  toast(`💬 Новое сообщение от ${name}`, 'ok');
  unreadChats++;
  updateChatsDot();
  if ($('#tab-chats').classList.contains('active')) renderChats();
}

/* ===== REALTIME ===== */
function initRealtime() {
  try {
    const ch1 = sb.channel('online_listings_rt')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'online_listings' },
        () => { if ($('#tab-online').classList.contains('active')) renderOnline(); })
      .subscribe();
    realtimeChannels.push(ch1);

    const ch2 = sb.channel('p2p_chats_rt')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'p2p_chats' },
        payload => {
          const chat = payload.new || payload.old;
          if (!chat) return;
          if (chat.seller_id === PLAYER_ID || chat.buyer_id === PLAYER_ID) {
            if ($('#tab-chats').classList.contains('active')) renderChats();
            if (currentChatId === chat.id && currentChatKind === 'p2p') {
              sb.from('p2p_chats').select('*').eq('id', chat.id).maybeSingle().then(({ data }) => {
                if (data) renderP2PQuickActions(data);
              });
            } else {
              unreadChats++;
              updateChatsDot();
            }
          }
        }).subscribe();
    realtimeChannels.push(ch2);
  } catch(e) {
    console.warn('Realtime init failed:', e);
  }
}

/* ===== BIND ===== */
function bindEvents() {
  $$('.tabbar button').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  $('#chatBack').addEventListener('click', () => {
    if (currentChatKind === 'p2p') {
      realtimeChannels.forEach(ch => sb.removeChannel(ch));
      realtimeChannels = [];
      initRealtime();
    }
    closeChatView();
  });

  $('#chatSend').addEventListener('click', async () => {
    const v = $('#chatInput').value.trim();
    if (!v) return;
    $('#chatInput').value = '';
    if (currentChatKind === 'p2p') {
      const { data: chat } = await sb.from('p2p_chats').select('*').eq('id', currentChatId).maybeSingle();
      if (chat) await sendP2PMessage(chat, v);
    } else {
      sendPlayerMessage(v);
    }
  });

  $('#chatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); $('#chatSend').click(); }
  });

  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
}

/* ===== TELEGRAM ===== */
function initTelegram() {
  const tg = window.Telegram?.WebApp;
  if (!tg) return;
  try { tg.ready(); } catch(e) {}
  try { tg.expand(); } catch(e) {}
  try { tg.setHeaderColor?.('#0e0f13'); } catch(e) {}
  try { tg.setBackgroundColor?.('#0e0f13'); } catch(e) {}
  try { tg.disableVerticalSwipes?.(); } catch(e) {}
}

/* ===== BOOT ===== */
(async function boot() {
  try {
    initTelegram();
    bindEvents();

    state = await loadGame();
    saveGame();

    $('#loading').classList.add('hide');
    renderBalance();
    renderMarket();
    renderSettings();

    try { startBuyerLoop(); } catch(e) { console.warn(e); }
    try { startMarketLoop(); } catch(e) { console.warn(e); }
    try { startBuyerForInventory(); } catch(e) { console.warn(e); }
    try { initRealtime(); } catch(e) { console.warn(e); }
  } catch(e) {
    console.error('BOOT ERROR:', e);
    const loading = $('#loading');
    if (loading) loading.innerHTML = `
      <div style="padding:20px;text-align:center;color:var(--red);font-size:13px;line-height:1.5;">
        <b>Ошибка загрузки</b><br><br>${String(e.message || e)}
      </div>
    `;
  }
})();
</script>

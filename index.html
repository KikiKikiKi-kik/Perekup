<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Перекуп Simulator</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f1f3f5;
    color: #111;
}

button, input {
    font: inherit;
}

.header {
    background: white;
    padding: 18px;
    position: sticky;
    top: 0;
    z-index: 20;
    border-bottom: 1px solid #ddd;
}

.logo {
    font-size: 23px;
    font-weight: 800;
}

.balance {
    margin-top: 7px;
    font-size: 20px;
    font-weight: 700;
}

.container {
    padding: 15px;
    padding-bottom: 90px;
}

.search {
    width: 100%;
    border: 0;
    background: white;
    border-radius: 13px;
    padding: 14px;
    outline: none;
    margin-bottom: 13px;
    box-shadow: 0 1px 4px #ddd;
}

.categories {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
    margin-bottom: 20px;
}

.category {
    border: 0;
    background: white;
    border-radius: 13px;
    padding: 15px 8px;
    box-shadow: 0 1px 4px #ddd;
    cursor: pointer;
}

.category:active {
    transform: scale(.97);
}

.section-title {
    font-size: 21px;
    font-weight: 800;
    margin: 18px 0 11px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 12px;
    box-shadow: 0 1px 5px #ddd;
}

.item-title {
    font-size: 19px;
    font-weight: 800;
}

.description {
    margin-top: 6px;
    color: #555;
}

.price {
    font-size: 19px;
    font-weight: 800;
    margin-top: 9px;
}

.market-price {
    color: #777;
    font-size: 13px;
    margin-top: 4px;
}

.seller {
    color: #777;
    margin-top: 7px;
}

.btn {
    width: 100%;
    border: 0;
    border-radius: 11px;
    padding: 12px;
    margin-top: 10px;
    background: #2481cc;
    color: white;
    cursor: pointer;
}

.btn.green {
    background: #20a05a;
}

.btn.gray {
    background: #777;
}

.btn.red {
    background: #d64545;
}

.btn.orange {
    background: #e88922;
}

.nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 67px;
    display: flex;
    background: white;
    border-top: 1px solid #ddd;
    z-index: 50;
}

.nav button {
    flex: 1;
    border: 0;
    background: white;
    font-size: 12px;
}

.hidden {
    display: none !important;
}

.back {
    border: 0;
    background: transparent;
    padding: 0;
    margin-bottom: 12px;
    font-size: 16px;
}

.chat-box {
    background: white;
    border-radius: 16px;
    padding: 12px;
    min-height: 300px;
}

.message {
    max-width: 85%;
    padding: 10px 12px;
    border-radius: 13px;
    margin: 7px 0;
    background: #eeeeee;
    line-height: 1.35;
}

.message.me {
    margin-left: auto;
    background: #d8f8d1;
}

.message.system {
    margin: 10px auto;
    background: #eee;
    color: #777;
    text-align: center;
    font-size: 13px;
}

.chat-input-row {
    display: flex;
    gap: 7px;
    margin-top: 10px;
}

.chat-input {
    flex: 1;
    min-width: 0;
    border: 1px solid #ddd;
    border-radius: 11px;
    padding: 12px;
    outline: none;
}

.send {
    width: 50px;
    border: 0;
    border-radius: 11px;
    background: #2481cc;
    color: white;
}

.typing {
    color: #777;
    font-size: 13px;
    margin: 7px 2px;
}

.stat {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid #eee;
}

.good {
    color: #159447;
}

.bad {
    color: #d33;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 600px;
    border-radius: 20px 20px 0 0;
    padding: 20px;
}

.modal-box input {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 11px;
    padding: 13px;
    outline: none;
    margin-top: 8px;
}

.small {
    font-size: 13px;
    color: #777;
}

.empty {
    text-align: center;
    color: #777;
    padding: 30px 10px;
}

.badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 8px;
    background: #eee;
    font-size: 12px;
    margin-top: 7px;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">🏪 Перекуп Simulator</div>
    <div class="balance" id="balance">💰 15 000 ₽</div>
</div>

<div class="container">

<!-- РЫНОК -->

<div id="marketPage">

    <input
        id="search"
        class="search"
        placeholder="🔎 Поиск товара..."
        oninput="renderMarket()"
    >

    <div class="categories">
        <button class="category" onclick="setCategory('Все')">🏪 Все</button>
        <button class="category" onclick="setCategory('Телефоны')">📱 Телефоны</button>
        <button class="category" onclick="setCategory('Машины')">🚗 Машины</button>
        <button class="category" onclick="setCategory('Игрушки')">🧸 Игрушки</button>
        <button class="category" onclick="setCategory('Техника')">💻 Техника</button>
        <button class="category" onclick="setCategory('Другое')">📦 Другое</button>
    </div>

    <div class="section-title">📢 Объявления</div>

    <div id="marketList"></div>

</div>


<!-- МОИ ТОВАРЫ -->

<div id="inventoryPage" class="hidden">

    <div class="section-title">📦 Мои товары</div>

    <div id="inventoryList"></div>

</div>


<!-- МОИ ОБЪЯВЛЕНИЯ -->

<div id="myListingsPage" class="hidden">

    <div class="section-title">🏷️ Мои объявления</div>

    <div id="myListingsList"></div>

</div>


<!-- ЧАТЫ -->

<div id="chatsPage" class="hidden">

    <div class="section-title">💬 Чаты</div>

    <div id="chatsList"></div>

</div>


<!-- ЧАТ -->

<div id="chatPage" class="hidden">

    <button class="back" onclick="showPage('chatsPage')">
        ← Назад
    </button>

    <div class="section-title" id="chatName">
        💬 Чат
    </div>

    <div class="chat-box">

        <div id="messages"></div>

        <div id="typing" class="typing"></div>

        <div class="chat-input-row">
            <input
                id="chatInput"
                class="chat-input"
                placeholder="Написать сообщение..."
                onkeydown="if(event.key==='Enter') sendMessage()"
            >

            <button class="send" onclick="sendMessage()">
                ➤
            </button>
        </div>

    </div>

</div>


<!-- ИСТОРИЯ -->

<div id="historyPage" class="hidden">

    <div class="section-title">📊 История</div>

    <div id="historyList"></div>

</div>

</div>


<!-- НИЖНЕЕ МЕНЮ -->

<div class="nav">

    <button onclick="showPage('marketPage')">
        🏪<br>Рынок
    </button>

    <button onclick="showPage('inventoryPage')">
        📦<br>Товары
    </button>

    <button onclick="showPage('myListingsPage')">
        🏷️<br>Продажи
    </button>

    <button onclick="showPage('chatsPage')">
        💬<br>Чаты
    </button>

    <button onclick="showPage('historyPage')">
        📊<br>История
    </button>

</div>


<!-- МОДАЛЬНОЕ ОКНО ПРОДАЖИ -->

<div id="sellModal" class="modal hidden">

    <div class="modal-box">

        <div class="section-title">
            🏷️ Выставить товар
        </div>

        <div id="sellInfo"></div>

        <input
            id="sellPrice"
            type="number"
            placeholder="Цена продажи"
        >

        <button class="btn green" onclick="createListing()">
            📢 Выставить объявление
        </button>

        <button class="btn gray" onclick="closeSellModal()">
            Отмена
        </button>

    </div>

</div>


<script>

/* =========================================================
   ДАННЫЕ
========================================================= */

let game = JSON.parse(
    localStorage.getItem("perekupGame")
) || {

    balance: 15000,

    inventory: [],

    listings: [],

    chats: {},

    history: []

};


let selectedCategory = "Все";

let currentChat = null;

let sellingInventoryIndex = null;


/* =========================================================
   ТОВАРЫ РЫНКА
========================================================= */

const market = [

    {
        id: 1,
        name: "iPhone 12",
        category: "Телефоны",
        description: "64 GB, хорошее состояние",
        price: 13500,
        marketPrice: 14500,
        seller: "Андрей"
    },

    {
        id: 2,
        name: "Samsung Galaxy S21",
        category: "Телефоны",
        description: "128 GB, есть небольшие царапины",
        price: 11500,
        marketPrice: 14500,
        seller: "Илья"
    },

    {
        id: 3,
        name: "PlayStation 4",
        category: "Техника",
        description: "Работает отлично, два геймпада",
        price: 12000,
        marketPrice: 16000,
        seller: "Денис"
    },

    {
        id: 4,
        name: "LEGO Technic",
        category: "Игрушки",
        description: "Почти новый набор",
        price: 4000,
        marketPrice: 5500,
        seller: "Максим"
    },

    {
        id: 5,
        name: "Nintendo Switch",
        category: "Техника",
        description: "Хорошее состояние",
        price: 18000,
        marketPrice: 20000,
        seller: "Роман"
    },

    {
        id: 6,
        name: "BMW E46",
        category: "Машины",
        description: "Есть небольшие проблемы",
        price: 450000,
        marketPrice: 500000,
        seller: "Сергей"
    }

];


/* =========================================================
   СОХРАНЕНИЕ
========================================================= */

function saveGame() {

    localStorage.setItem(
        "perekupGame",
        JSON.stringify(game)
    );

}


/* =========================================================
   БАЛАНС
========================================================= */

function updateBalance() {

    document.getElementById("balance").textContent =
        "💰 " +
        game.balance.toLocaleString("ru-RU") +
        " ₽";

}


/* =========================================================
   СТРАНИЦЫ
========================================================= */

function showPage(pageId) {

    const pages = [
        "marketPage",
        "inventoryPage",
        "myListingsPage",
        "chatsPage",
        "chatPage",
        "historyPage"
    ];

    pages.forEach(id => {

        document
            .getElementById(id)
            .classList.add("hidden");

    });

    document
        .getElementById(pageId)
        .classList.remove("hidden");

    if(pageId === "marketPage")
        renderMarket();

    if(pageId === "inventoryPage")
        renderInventory();

    if(pageId === "myListingsPage")
        renderMyListings();

    if(pageId === "chatsPage")
        renderChats();

    if(pageId === "historyPage")
        renderHistory();

}


/* =========================================================
   РЫНОК
========================================================= */

function setCategory(category) {

    selectedCategory = category;

    renderMarket();

}


function renderMarket() {

    const list =
        document.getElementById("marketList");

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const items = market.filter(item => {

        const categoryOK =
            selectedCategory === "Все" ||
            item.category === selectedCategory;

        const searchOK =
            item.name
                .toLowerCase()
                .includes(search);

        return categoryOK && searchOK;

    });

    list.innerHTML = "";

    if(items.length === 0) {

        list.innerHTML =
            '<div class="empty">Ничего не найдено.</div>';

        return;

    }

    items.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "card";

        let priceClass = "";

        if(item.price < item.marketPrice * 0.9)
            priceClass = "good";

        if(item.price > item.marketPrice * 1.1)
            priceClass = "bad";

        card.innerHTML = `

            <div class="item-title">
                ${getEmoji(item.category)} ${item.name}
            </div>

            <div class="description">
                ${item.description}
            </div>

            <div class="price ${priceClass}">
                ${formatMoney(item.price)}
            </div>

            <div class="market-price">
                Рыночная цена: примерно
                ${formatMoney(item.marketPrice)}
            </div>

            <div class="seller">
                👤 ${item.seller}
            </div>

            <button class="btn gray"
                onclick="openSellerChat(
                    '${escapeJS(item.seller)}',
                    ${item.id}
                )">
                💬 Написать продавцу
            </button>

            <button class="btn"
                onclick="buyMarketItem(${item.id})">
                💰 Купить за ${formatMoney(item.price)}
            </button>
        `;

        list.appendChild(card);

    });

}


/* =========================================================
   ПОКУПКА
========================================================= */

function buyMarketItem(id) {

    const item =
        market.find(x => x.id === id);

    if(!item)
        return;

    if(game.balance < item.price) {

        alert(
            "❌ Не хватает денег.\n\n" +
            "Нужно: " +
            formatMoney(item.price)
        );

        return;

    }

    const ok = confirm(
        "Купить " +
        item.name +
        " за " +
        formatMoney(item.price) +
        "?"
    );

    if(!ok)
        return;

    game.balance -= item.price;

    game.inventory.push({

        id: Date.now(),

        name: item.name,

        category: item.category,

        description: item.description,

        buyPrice: item.price,

        marketPrice: item.marketPrice

    });

    game.history.push({

        type: "buy",

        text:
            "Куплен " +
            item.name +
            " за " +
            formatMoney(item.price),

        time: new Date().toLocaleString("ru-RU")

    });

    saveGame();

    updateBalance();

    renderInventory();

    alert(
        "✅ Покупка совершена!\n\n" +
        item.name +
        " теперь находится в твоих товарах."
    );

}


/* =========================================================
   ИНВЕНТАРЬ
========================================================= */

function renderInventory() {

    const list =
        document.getElementById("inventoryList");

    list.innerHTML = "";

    if(game.inventory.length === 0) {

        list.innerHTML =
            '<div class="empty">' +
            '📦 У тебя пока нет товаров.' +
            '</div>';

        return;

    }

    game.inventory.forEach((item,index) => {

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <div class="item-title">
                ${getEmoji(item.category)}
                ${item.name}
            </div>

            <div class="description">
                ${item.description}
            </div>

            <div class="stat">
                <span>Покупка</span>
                <b>${formatMoney(item.buyPrice)}</b>
            </div>

            <div class="stat">
                <span>Рынок</span>
                <b>${formatMoney(item.marketPrice)}</b>
            </div>

            <button class="btn green"
                onclick="openSellModal(${index})">
                🏷️ Выставить на продажу
            </button>

        `;

        list.appendChild(card);

    });

}


/* =========================================================
   ОКНО ПРОДАЖИ
========================================================= */

function openSellModal(index) {

    sellingInventoryIndex = index;

    const item =
        game.inventory[index];

    if(!item)
        return;

    document.getElementById("sellInfo").innerHTML = `

        <div class="card">

            <b>
                ${getEmoji(item.category)}
                ${item.name}
            </b>

            <div class="small">
                Ты купил его за
                ${formatMoney(item.buyPrice)}
            </div>

            <div class="small">
                Рыночная цена:
                ${formatMoney(item.marketPrice)}
            </div>

        </div>

        <div class="small">
            💡 Если поставить слишком высокую цену,
            покупатели будут предлагать меньше или
            вообще могут не написать.
        </div>

    `;

    document.getElementById("sellPrice").value =
        Math.round(item.marketPrice);

    document
        .getElementById("sellModal")
        .classList.remove("hidden");

}


function closeSellModal() {

    document
        .getElementById("sellModal")
        .classList.add("hidden");

    sellingInventoryIndex = null;

}


/* =========================================================
   СОЗДАНИЕ ОБЪЯВЛЕНИЯ
========================================================= */

function createListing() {

    const index =
        sellingInventoryIndex;

    if(index === null)
        return;

    const item =
        game.inventory[index];

    if(!item)
        return;

    const input =
        document.getElementById("sellPrice");

    const price =
        Number(input.value);

    if(!price || price <= 0) {

        alert("Введите нормальную цену.");

        return;

    }

    game.listings.push({

        id: Date.now(),

        name: item.name,

        category: item.category,

        description: item.description,

        buyPrice: item.buyPrice,

        marketPrice: item.marketPrice,

        price: price,

        createdAt: Date.now(),

        buyer: null,

        sold: false

    });

    game.inventory.splice(index,1);

    game.history.push({

        type: "listing",

        text:
            "Выставлен " +
            item.name +
            " за " +
            formatMoney(price),

        time: new Date().toLocaleString("ru-RU")

    });

    saveGame();

    closeSellModal();

    renderInventory();

    renderMyListings();

    alert(
        "📢 Объявление опубликовано!\n\n" +
        "Теперь товар НЕ продаётся автоматически.\n" +
        "Покупатели должны сначала написать тебе."
    );

    showPage("myListingsPage");

}


/* =========================================================
   МОИ ОБЪЯВЛЕНИЯ
========================================================= */

function renderMyListings() {

    const list =
        document.getElementById("myListingsList");

    list.innerHTML = "";

    if(game.listings.length === 0) {

        list.innerHTML =
            '<div class="empty">' +
            '🏷️ Ты пока ничего не продаёшь.' +
            '</div>';

        return;

    }

    game.listings.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "card";

        const difference =
            item.price - item.marketPrice;

        let status = "";

        if(item.sold) {

            status =
                '<span class="badge">✅ Продано</span>';

        } else if(difference > item.marketPrice * 0.2) {

            status =
                '<span class="badge">💸 Очень дорого</span>';

        } else if(difference > item.marketPrice * 0.1) {

            status =
                '<span class="badge">⚠️ Дороговато</span>';

        } else {

            status =
                '<span class="badge">🟢 Нормальная цена</span>';

        }

        card.innerHTML = `

            <div class="item-title">
                ${getEmoji(item.category)}
                ${item.name}
            </div>

            <div class="price">
                ${formatMoney(item.price)}
            </div>

            <div class="market-price">
                Рыночная цена:
                ${formatMoney(item.marketPrice)}
            </div>

            ${status}

            ${
                item.sold
                ?
                `<div class="seller">
                    Покупатель: ${item.buyer}
                </div>`
                :
                `<div class="small" style="margin-top:8px">
                    Покупатели могут написать тебе.
                </div>`
            }

        `;

        list.appendChild(card);

    });

}


/* =========================================================
   ПОКУПАТЕЛИ
========================================================= */

const buyers = [

    {
        name: "Илья",
        budget: 20000,
        patience: 0.8
    },

    {
        name: "Миша",
        budget: 30000,
        patience: 0.6
    },

    {
        name: "Даня",
        budget: 15000,
        patience: 0.9
    },

    {
        name: "Саша",
        budget: 50000,
        patience: 0.7
    }

];


/*
    Проверяем объявления.
    В этой версии проверка происходит периодически.
*/

function checkForBuyers() {

    game.listings.forEach(listing => {

        if(listing.sold)
            return;

        /*
            Если цена сильно выше рынка,
            вероятность сообщения маленькая.
        */

        let chance = 0.5;

        const ratio =
            listing.price /
            listing.marketPrice;

        if(ratio <= 0.9)
            chance = 0.9;

        else if(ratio <= 1.05)
            chance = 0.75;

        else if(ratio <= 1.15)
            chance = 0.5;

        else if(ratio <= 1.3)
            chance = 0.2;

        else
            chance = 0.05;

        if(Math.random() > chance)
            return;

        const buyer =
            buyers[
                Math.floor(
                    Math.random() *
                    buyers.length
                )
            ];

        if(listing.price > buyer.budget)
            return;

        createBuyerChat(
            buyer,
            listing
        );

    });

}


/* =========================================================
   СОЗДАНИЕ ЧАТА ПОКУПАТЕЛЯ
========================================================= */

function createBuyerChat(buyer,listing) {

    const chatId =
        "buyer_" + listing.id;

    if(game.chats[chatId])
        return;

    game.chats[chatId] = {

        id: chatId,

        person: buyer.name,

        type: "buyer",

        listingId: listing.id,

        itemName: listing.name,

        messages: [

            {
                me: false,

                text:
                    "Здравствуйте! " +
                    "Товар ещё продаётся?"
            }

        ],

        waiting: false

    };

    saveGame();

    renderChats();

}


/* =========================================================
   ОТКРЫТЬ ЧАТ С ПОКУПАТЕЛЕМ
========================================================= */

function openBuyerChat(chatId) {

    currentChat = chatId;

    const chat =
        game.chats[chatId];

    if(!chat)
        return;

    document.getElementById("chatName")
        .textContent =
        "💬 " + chat.person;

    showPage("chatPage");

    renderCurrentChat();

}


/* =========================================================
   ЧАТ С ПРОДАВЦОМ
========================================================= */

function openSellerChat(seller,id) {

    const chatId =
        "seller_" + seller + "_" + id;

    if(!game.chats[chatId]) {

        const item =
            market.find(x => x.id === id);

        game.chats[chatId] = {

            id: chatId,

            person: seller,

            type: "seller",

            itemId: id,

            itemName:
                item ? item.name : "",

            messages: [

                {
                    me: false,

                    text:
                        "Здравствуйте! " +
                        "Интересует мой товар?"
                }

            ],

            waiting: false

        };

        saveGame();

    }

    currentChat = chatId;

    document.getElementById("chatName")
        .textContent =
        "💬 " + seller;

    showPage("chatPage");

    renderCurrentChat();

}


/* =========================================================
   ОТОБРАЖЕНИЕ ЧАТА
========================================================= */

function renderCurrentChat() {

    const chat =
        game.chats[currentChat];

    const box =
        document.getElementById("messages");

    box.innerHTML = "";

    chat.messages.forEach(message => {

        const div =
            document.createElement("div");

        div.className =
            "message " +
            (message.me ? "me" : "");

        div.textContent =
            message.text;

        box.appendChild(div);

    });

    box.scrollTop =
        box.scrollHeight;

}


/* =========================================================
   ОТПРАВКА СООБЩЕНИЯ
========================================================= */

function sendMessage() {

    const input =
        document.getElementById("chatInput");

    const text =
        input.value.trim();

    if(!text)
        return;

    const chat =
        game.chats[currentChat];

    if(!chat)
        return;

    chat.messages.push({

        me: true,

        text: text

    });

    input.value = "";

    saveGame();

    renderCurrentChat();

    if(chat.type === "buyer")
        buyerReply(chat);

    else
        sellerReply(chat);

}


/* =========================================================
   ОТВЕТ ПОКУПАТЕЛЯ
========================================================= */

function buyerReply(chat) {

    if(chat.waiting)
        return;

    chat.waiting = true;

    document.getElementById("typing")
        .textContent =
        "Покупатель печатает...";

    const listing =
        game.listings.find(
            x => x.id === chat.listingId
        );

    let delay =
        5000 +
        Math.floor(Math.random() * 7000);

    setTimeout(() => {

        chat.waiting = false;

        document.getElementById("typing")
            .textContent = "";

        let text =
            getBuyerReply(
                chat,
                listing
            );

        chat.messages.push({

            me: false,

            text: text

        });

        saveGame();

        renderCurrentChat();

    },delay);

}


/* =========================================================
   ЛОГИКА ОТВЕТОВ ПОКУПАТЕЛЯ
========================================================= */

function getBuyerReply(chat,listing) {

    const last =
        chat.messages[
            chat.messages.length - 2
        ];

    const text =
        last
        ? last.text.toLowerCase()
        : "";

    if(
        text.includes("привет") ||
        text.includes("здрав")
    ) {

        return (
            "Привет! Да, я по поводу " +
            chat.itemName +
            "."
        );

    }

    if(
        text.includes("сколько") ||
        text.includes("цена")
    ) {

        return (
            "Увидел цену в объявлении. " +
            "А немного уступить сможете?"
        );

    }

    if(
        text.includes("скид") ||
        text.includes("уступ")
    ) {

        if(listing) {

            const offer =
                Math.round(
                    listing.marketPrice * 0.95
                );

            return (
                "Могу предложить " +
                formatMoney(offer) +
                "."
            );

        }

        return "Немного могу уступить.";

    }

    if(
        text.includes("заберу") ||
        text.includes("беру")
    ) {

        if(listing) {

            if(
                listing.price <=
                listing.marketPrice * 1.1
            ) {

                return (
                    "Хорошо, цена меня устраивает. " +
                    "Давайте оформим сделку."
                );

            }

            return (
                "За такую цену дороговато. " +
                "Если снизите, я заберу."
            );

        }

    }

    if(
        text.includes("дорого") ||
        text.includes("дорог")
    ) {

        if(listing) {

            return (
                "Согласен, для меня дороговато. " +
                "Могу дать " +
                formatMoney(
                    Math.round(
                        listing.marketPrice * 0.9
                    )
                ) +
                "."
            );

        }

    }

    return (
        "Понял. А что можете предложить по цене?"
    );

}


/* =========================================================
   ОТВЕТ ПРОДАВЦА
========================================================= */

function sellerReply(chat) {

    if(chat.waiting)
        return;

    chat.waiting = true;

    document.getElementById("typing")
        .textContent =
        "Продавец печатает...";

    const delay =
        4000 +
        Math.floor(Math.random() * 7000);

    setTimeout(() => {

        chat.waiting = false;

        document.getElementById("typing")
            .textContent = "";

        const last =
            chat.messages[
                chat.messages.length - 2
            ];

        const text =
            last
            ? last.text.toLowerCase()
            : "";

        let reply;

        if(
            text.includes("привет") ||
            text.includes("здрав")
        ) {

            reply =
                "Привет! Что вас интересует?";

        } else if(
            text.includes("скид") ||
            text.includes("уступ")
        ) {

            reply =
                "Могу немного уступить, " +
                "но сильно цену снижать не буду.";

        } else if(
            text.includes("дорого")
        ) {

            reply =
                "Можешь предложить свою цену.";

        } else if(
            text.includes("заберу") ||
            text.includes("беру")
        ) {

            reply =
                "Хорошо, договорились.";

        } else {

            reply =
                "Понял. А какую цену предлагаете?";

        }

        chat.messages.push({

            me: false,

            text: reply

        });

        saveGame();

        renderCurrentChat();

    },delay);

}


/* =========================================================
   СПИСОК ЧАТОВ
========================================================= */

function renderChats() {

    const list =
        document.getElementById("chatsList");

    list.innerHTML = "";

    const chats =
        Object.values(game.chats);

    if(chats.length === 0) {

        list.innerHTML =
            '<div class="empty">' +
            '💬 Пока никто не написал.' +
            '</div>';

        return;

    }

    chats.forEach(chat => {

        const card =
            document.createElement("div");

        card.className = "card";

        const last =
            chat.messages[
                chat.messages.length - 1
            ];

        card.innerHTML = `

            <div class="item-title">
                ${chat.type === "buyer" ? "👤" : "🏪"}
                ${chat.person}
            </div>

            <div class="description">
                ${chat.itemName}
            </div>

            <div class="small">
                ${last ? last.text : ""}
            </div>

            <button class="btn"
                onclick="openBuyerChat('${chat.id}')">
                💬 Открыть
            </button>

        `;

        list.appendChild(card);

    });

}


/* =========================================================
   ИСТОРИЯ
========================================================= */

function renderHistory() {

    const list =
        document.getElementById("historyList");

    list.innerHTML = "";

    if(game.history.length === 0) {

        list.innerHTML =
            '<div class="empty">' +
            '📊 История пока пустая.' +
            '</div>';

        return;

    }

    [...game.history]
        .reverse()
        .forEach(item => {

            const card =
                document.createElement("div");

            card.className = "card";

            card.innerHTML = `

                <div>${item.text}</div>

                <div class="small">
                    ${item.time}
                </div>

            `;

            list.appendChild(card);

        });

}


/* =========================================================
   УТИЛИТЫ
========================================================= */

function formatMoney(value) {

    return Number(value)
        .toLocaleString("ru-RU") + " ₽";

}


function getEmoji(category) {

    const emojis = {

        "Телефоны": "📱",

        "Машины": "🚗",

        "Игрушки": "🧸",

        "Техника": "💻",

        "Другое": "📦"

    };

    return emojis[category] || "📦";

}


function escapeJS(text) {

    return String(text)
        .replace(/'/g,"\\'");

}


/* =========================================================
   ЗАПУСК
========================================================= */

updateBalance();

renderMarket();

setInterval(() => {

    checkForBuyers();

    renderChats();

    renderMyListings();

},15000);

</script>
